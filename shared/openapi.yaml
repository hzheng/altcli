        reservations:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
        turns:
          type: array
          items:
            $ref: '#/components/schemas/TurnEvent'
          description: Latest turn-complete event per registered session, plus the latest unmatched one.
        serverTime:
          type: string
          format: date-time
      required:
      - mode
      - inputEnabled
      - sessions
      - instances
      - panes
      - panesError
      - pairs
      - snapshots
      - commands
      - reservations
      - turns
      - serverTime
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    ReleaseInput:
      type: object
      properties:
        expectedCommandId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        confirmReady:
          const: true
          type: boolean
      required:
      - expectedCommandId
      - confirmReady
    ReleaseResult:
      type: object
      properties:
        released:
          type: boolean
          const: true
      required:
      - released
    CommandInput:
      oneOf:
      - type: object
        properties:
          requestId:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          agentId:
            $ref: '#/components/schemas/AgentId'
          confirmReady:
            type: boolean
            const: true
          kind:
            const: relay
            type: string
          pairId:
            $ref: '#/components/schemas/AgentId'
          autoContinue:
            type: boolean
          turnLimit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          text:
            type: string
            minLength: 1
            maxLength: 2000
            description: 'Optional context; the controller sends "<registered relay prompt>: <text>". Line breaks are allowed.'
        required:
        - requestId
        - agentId
        - confirmReady
        - kind
        additionalProperties: false
      - type: object
        properties:
          requestId:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          agentId:
            $ref: '#/components/schemas/AgentId'
          confirmReady:
            type: boolean
            const: true
          kind:
            const: instruction
            type: string
          pairId:
            $ref: '#/components/schemas/AgentId'
          autoContinue:
            type: boolean
          turnLimit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          text:
            type: string
            minLength: 1
            maxLength: 2000
            description: Nonblank input of one or more lines; maximum 2,000 UTF-8 bytes. CRLF is normalized to LF;
              other controls, DEL/C1 and Unicode line separators are rejected. Multi-line text reaches the terminal
              as one bracketed paste. The byte limit is stricter than maxLength for multibyte text.
          handoff:
            type: boolean
            description: When true, finishing this instruction hands off to the relay partner as an accepted-and-improved
              turn would; its result is the next thing to review. Default false.
        required:
        - requestId
        - agentId
        - confirmReady
        - kind
        - text
        additionalProperties: false
      description: A unique client UUID v4 is required. Same ID and payload returns the stored result without redelivery.
        Reuse with a different payload conflicts. Never retry automatically after an uncertain response.
    InstanceState:
      type: object
      properties:
        agentId:
          $ref: '#/components/schemas/AgentId'
        status:
          type: string
          enum:
          - current
          - replaced
          - unknown
      required:
      - agentId
      - status
