openapi: 3.1.0
info:
  title: CoderCrew host API
  version: 0.1.0
  description: Host-resident tmux console with explicit Plan and Implementation phases, captured ignored plans, committed handoffs recorded in an app-owned journal, and an opt-in deprecated staging relay.
    Native iOS remains deferred. This contract and the JSON-only TypeScript types are maintained together.
servers:
- url: http://127.0.0.1:8787
  description: Local host; use the configured HTTPS Tailscale origin for remote access.
security:
- ownerToken: []
paths:
  /api/v1/planning:
    post: {"operationId":"startPlan","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PlanStart"}}}},"responses":{"200":{"description":"Planning delivery recorded; not plan completion","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CommandRecord"}}}},"409":{"description":"Planning readiness, ignore, ownership or identity conflict","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/planning/decision:
    post: {"operationId":"decidePlan","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PlanDecision"}}}},"responses":{"200":{"description":"Exact-version decision recorded; no duplicate transition","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}},"409":{"description":"Stale version, missing consent, unsafe state or unauthorized override","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/instructions:
    post:
      operationId: sendStandaloneInstruction
      description: Send one instruction with exact group/instance confirmation and worktree ownership. No branch setup, handoff commit, or automatic successor. Available without legacy staging enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StandaloneStart'}
      responses:
        '200':
          description: Delivery receipt, not task acceptance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandRecord'}
        '409':
          description: Identity, ownership, or policy conflict
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/implementation:
    post: {"operationId":"startImplementation","description":"INTEGRATION_BRANCH refuses the default or a configured integration branch as the implementation branch, or as a new branch name. BASELINE_REQUIRED asks for a confirmed taskBase on an existing task branch whose start cannot be inferred; INVALID_BASELINE rejects one outside the branch or a review range before it.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ImplementationStart"}}}},"responses":{"200":{"description":"Recorded result; not proof of task acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/CommandRecord"}}}},"409":{"description":"State, ownership, validation, or policy conflict","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/implementation/preview:
    post:
      operationId: previewCommittedReview
      description: Read-only preview of an explicit ancestor..HEAD range, or of the commits after the newest first-parent commit at which the recipient completed a turn per CoderCrew's handoff journal (falling back to the task baseline). Does not create a run, bind agents, send input or mutate Git. Refuses stale HEAD and ranges exceeding 100 commits. With commitPending=true, allows an empty or log-only committed portion and offers HEAD as a baseline for a future snapshot; otherwise requires a project proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewPreviewInput'}
      responses:
        '200':
          description: Exact range and included commits, newest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewPreview'}
        '409':
          description: Stale HEAD, unavailable group or invalid range
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/history/export:
    get:
      operationId: exportHistory
      summary: Back up CoderCrew's own history, which cloning the repository cannot recover
      description: Every run and turn (captured plan results and publications included) plus the handoff journal, optionally limited to one worktree root. Read-only; touches no Git state.
      parameters:
      - {name: repository, in: query, required: false, schema: {type: string, maxLength: 4096}, description: Absolute worktree root to limit the export to.}
      responses:
        '200':
          description: Complete history for backup or task summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryExport'}
        '400':
          description: Invalid repository filter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/implementation/policy:
    post: {"operationId":"changeImplementationPolicy","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PolicyChange"}}}},"responses":{"200":{"description":"Recorded result; not proof of task acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}},"409":{"description":"State, ownership, validation, or policy conflict","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/groups:
    post: {"operationId":"createGroup","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GroupInput"}}}},"responses":{"200":{"description":"Recorded result; not proof of task acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Group"}}}},"409":{"description":"State, ownership, validation, or policy conflict","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/groups/{id}:
    patch: {operationId: selectWorkspaceGroup, parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/AgentId'}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupSelection'}}}}, responses: {'200': {description: Saved the workspace's sole group selection without dispatch, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}, '409': {description: Stale selection or occupied checkout, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}}}
    delete: {"operationId":"removeGroup","parameters":[{"name":"id","in":"path","required":true,"schema":{"$ref":"#/components/schemas/AgentId"}}],"responses":{"200":{"description":"Recorded result; not proof of task acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}},"409":{"description":"State, ownership, validation, or policy conflict","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/runs:
    post: {"operationId":"actOnRun","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RunAction"}}}},"responses":{"200":{"description":"Recorded result; not proof of task acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}},"409":{"description":"State, ownership, validation, or policy conflict","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/state:
    get:
      operationId: getConsoleState
      summary: Read discovered and bound agents, current snapshots, recent commands and ownership
      responses:
        '200':
          description: Fresh server state; individual panes may be unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleState'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied or real input disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error; delivery may be uncertain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/commands:
    post:
      operationId: submitCommand
      summary: Start an opt-in deprecated staging run
      description: New starts require CODERCREW_ENABLE_LEGACY_RELAY=true. Preserves the frozen staging protocol.
        Workflow ownership survives transport delivery until completion or explicit takeover. Uncertain commands are never replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandInput'
      responses:
        '200':
          description: Stored transport result, including delivered, rejected, or uncertain; not proof of agent
            completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandRecord'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied or real input disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Reserved turn, ID conflict, or changed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: JSON media type required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error; delivery may be uncertain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/control/release:
    post:
      operationId: acknowledgeUncertainDelivery
      summary: Acknowledge an uncertain delivery after inspecting the terminal
      description: Clears the hold that an uncertain (or restart-interrupted) command keeps on its worktree. Requires
        human confirmation. Does not resend, interrupt an agent, approve code, or mark a task complete. The expected
        command ID must still hold the worktree.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseInput'
      responses:
        '200':
          description: Hold cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied or real input disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Reserved turn, ID conflict, or changed state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: JSON media type required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error; delivery may be uncertain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/sessions:
    post:
      operationId: registerSession
      summary: Register one live tmux pane as an agent
      description: Records the pane's identity and the foreground process name observed now; sends no input. Shells and
        generic interpreters are refused. A label that maps to an existing id re-points that registration at the new pane.
        Refused while the affected worktree has a command in flight or an unacknowledged uncertain delivery, or when
        moving a paired session to another repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '200':
          description: Registration stored; no input was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Reserved turn, shell or generic process, duplicate pane, unsafe pane, or tmux failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: JSON media type required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/sessions/{id}:
    patch: {operationId: renameSession, parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/AgentId'}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RenameSession'}}}}, responses: {'200': {description: Display name changed; registration identity and historical snapshots unchanged, content: {application/json: {schema: {$ref: '#/components/schemas/SessionRegistration'}}}}, '409': {description: Stale registration, duplicate label or occupied checkout, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}}}
    delete:
      operationId: removeSession
      summary: Forget one registration
      description: The tmux pane and its agent keep running; only CoderCrew forgets the pane. Refused while the worktree's
        worktree is held. Idle group references are updated; command history and frozen runs keep the agent id.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AgentId'
      responses:
        '200':
          description: Registration removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveResult'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No registration with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The worktree is held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/panes/preview:
    get:
      operationId: previewPane
      summary: Read the last lines of any live pane
      description: Bounded read-only capture for the registration picker, so a human can tell similar panes apart. No
        identity check applies because nothing is registered yet. The token holder can read any pane on the server.
      parameters:
      - name: paneId
        in: query
        required: true
        description: Exact pane ID, URL-encoded (a "%" becomes "%25").
        schema:
          type: string
          pattern: ^%\d+$
      responses:
        '200':
          description: Captured text; not a lifecycle or readiness signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanePreview'
        '400':
          description: Invalid pane ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: tmux failure, e.g. no such pane or no server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/workspaces:
    get:
      operationId: discoverWorkspaces
      summary: Discover local projects, their Git worktrees, and exact-directory agent groups
      description: Read-only. Lists all panes, detached sessions included, canonicalizes each pane's directory, inspects
        the actual Git worktree, index and checked-out branch, and groups panes by canonical directory. Known coding CLIs
        in safe panes are eligible; shells, unidentified processes and dead, copy-mode or synchronized panes are shown
        with a reason. All eligible agents are selected initially; execution currently supports one or two. Projects
        are identified by canonical Git common directory, never origin or branch. Git worktree inventory includes
        checkouts without panes. Projects remembered by explicit edits, Start or creation remain discoverable after
        restart. Nothing is registered, started, persisted or written to Git by this GET.
      responses:
        '200':
          description: Workspace cards, skipped directories and a listing error when tmux itself failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDiscovery'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/projects/worktrees/preview:
    post:
      operationId: previewTaskWorktree
      summary: Read-only preview of a new branch and linked worktree
      description: Validates a known project, accessible source with a commit, new branch, and unused destination under ~/.codercrew. Does not create directories or reserve setup. Dirty source files are not copied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorktreePreviewInput'
      responses:
        '200':
          description: Exact source identity, branch, commit, destination and request ID to confirm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorktreePreview'
        default:
          description: Invalid input, authentication/origin refusal, unavailable source or branch/path conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/projects/worktrees:
    post:
      operationId: createTaskWorktree
      summary: Create one explicitly confirmed task branch and linked worktree
      description: Requires input enabled. Revalidates the preview and durably claims project setup before one non-force git worktree add. Exact duplicate request IDs return the recorded operation, never repeat Git. Existing checkouts, dirty changes and agents are untouched. Errors after a Git attempt retain uncertain ownership; no automatic retry, rollback or cleanup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorktreeCreateInput'
      responses:
        '200':
          description: Durable operation state; ready, applying, uncertain or failed is explicit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorktreeCreation'
        default:
          description: Invalid input, authentication/origin or read-only refusal, stale consent, conflict or setup already owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/projects/worktrees/removal/preview:
    post:
      operationId: previewWorktreeRemoval
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeRemovalInput'}
      responses:
        '200':
          description: Read-only exact integration and unused clean worktree check
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeRemovalPreview'}
        '409': {description: Worktree is occupied, dirty, inaccessible or integration cannot be verified}
  /api/v1/projects/worktrees/removal:
    post:
      operationId: removeWorktree
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeRemoveInput'}
      responses:
        '200':
          description: Durable removal result; uncertain results retain ownership and are never retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeRemoval'}
        '403': {description: Host input disabled}
        '409': {description: Conflicting request or project setup owner}
  /api/v1/projects/worktrees/removal/reconcile:
    post:
      operationId: inspectWorktreeRemoval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
      responses:
        '200':
          description: Read-only inspection; verified absence completes removal, unchanged original releases the hold as failed, otherwise uncertainty remains
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeRemoval'}
        '404': {description: Unknown removal request}
  /api/v1/projects/worktrees/integration/preview:
    post:
      operationId: previewWorktreeIntegration
      summary: Read-only preview of one squash commit into the integration branch
      description: Requires a linked task worktree on a named non-integration branch, a clean checkout that has the integration branch (main, else the recorded default) checked out with a committer identity, an unambiguous merge base, and a conflict-free `git merge-tree` result that changes the target tree. Neither checkout is modified. Uncommitted task-worktree changes are reported, not squashed. Run or delivery ownership of either checkout refuses the preview. Optional through selects an inclusive task-branch commit; omitted means HEAD. Applicable prior batches supply the next baseline; retired checkpoints and checkpoints outside the current source or target history are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeIntegrationInput'}
      responses:
        '200':
          description: Exact operation, commits, merged tree and an editable default commit message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeIntegrationPreview'}
        '409': {description: Conflict, dirty or missing integration checkout, nothing to integrate, ambiguous baseline, occupied checkout or inaccessible worktree}
  /api/v1/projects/worktrees/integration:
    post:
      operationId: integrateWorktree
      summary: Confirmed squash integration
      description: The compact confirmation repeats the preview's consent digest and the (edited) message; the server re-derives the preview and refuses a changed digest. The message budget (8 KiB JSON-encoded) plus bounded identifiers keeps every accepted request within the 16 KiB body limit, and the generated default already fits it. It then revalidates ownership and stages the exact previewed merged tree via a streamed binary diff and `git apply --index --binary`, then runs `git commit -m <message>` in the integration checkout under the repository's normal hook policy. Exactly one new single-parent commit whose tree equals the previewed merge tree is verified; anything else is uncertain and never retried. The task branch and worktree are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeIntegrateRequest'}
      responses:
        '200':
          description: Durable integration result; uncertain results retain ownership and are never retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeIntegration'}
        '403': {description: Host input disabled}
        '409': {description: Changed consent, conflicting request or project setup owner}
  /api/v1/projects/worktrees/integration/reconcile:
    post:
      operationId: inspectWorktreeIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
      responses:
        '200':
          description: Read-only inspection. A dirty integration checkout keeps the operation uncertain (the staged squash may still be pending). A clean checkout settles it — the previewed commit anywhere on the branch's first-parent chain since the pinned tip completes it, an unchanged tip or a tip that moved on without that commit releases the hold as failed; nothing is retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeIntegration'}
        '404': {description: Unknown integration request}
  /api/v1/projects/worktrees/discard/preview:
    post:
      operationId: previewWorktreeDiscard
      summary: Read-only preview of what a forced discard would lose
      description: Requires a linked task worktree on a named non-integration branch with no pane, run owner or unresolved delivery. Modified files and commits absent from the integration branch are counted and reported, not refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeDiscardInput'}
      responses:
        '200':
          description: Worktree, branch and the work that would be lost
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiscardPreview'}
        '409': {description: Occupied or inaccessible worktree, or an integration-branch worktree}
  /api/v1/projects/worktrees/discard:
    post:
      operationId: discardWorktree
      summary: Confirmed forced removal of a worktree and deletion of its branch
      description: The branch name must be repeated in confirmBranch. After revalidating the preview and occupancy and archiving unarchived handoff commits in the journal, runs `git worktree remove --force` and `git branch -D`. Run history is retained; the commits become unreachable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeDiscardConfirm'}
      responses:
        '200':
          description: Durable discard result; uncertain results retain ownership and are never retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiscard'}
        '403': {description: Host input disabled}
        '409': {description: Conflicting request or project setup owner}
  /api/v1/projects/worktrees/discard/reconcile:
    post:
      operationId: inspectWorktreeDiscard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
      responses:
        '200':
          description: Read-only inspection; verified absence of directory, worktree entry and branch completes the discard, the unchanged original releases the hold as failed, and every other state is described in the message while uncertainty remains. When only the branch is left at the confirmed head, branchRemains marks that a confirmed finish may delete it
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiscard'}
        '404': {description: Unknown discard request}
  /api/v1/projects/worktrees/discard/finish:
    post:
      operationId: finishWorktreeDiscard
      summary: Confirmed completion of an uncertain discard whose worktree is gone while its branch remains
      description: Re-verifies live that the directory and Git worktree entry are absent and the branch is at the confirmed head, then runs only `git branch -D`. Any other state, including a moved branch, refuses without touching Git. Nothing is retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, confirm]
              properties:
                requestId: {type: string, format: uuid}
                confirm: {type: boolean, const: true}
      responses:
        '200':
          description: Durable discard result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiscard'}
        '403': {description: Host input disabled}
        '404': {description: Unknown discard request}
        '409': {description: Not at the branch-only step, or already being finished}
  /api/v1/projects/worktrees/reconcile:
    post:
      operationId: reconcileTaskWorktree
      summary: Inspect an uncertain creation without any Git mutation
      description: Exact clean destination, branch and baseline verify success. Verified absence of destination, worktree entry and branch releases a failed operation. Partial, changed or unreadable results remain uncertain and owned. Applying operations are not reconciled while their caller is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        '200':
          description: Current or reconciled operation, without replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorktreeCreation'
        default:
          description: Invalid input, authentication/origin refusal or unknown operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/activities/reset:
    post:
      operationId: resetActivity
      summary: Restore Unknown activity to human-confirmed Ready
      description: Requires an inspected empty prompt with no background writers. Checks the exact current
        registration, CLI identity and activity timestamp. Refuses known activity, owned runs and pending
        deliveries. Preserves configuration; never sends input or changes workflow ownership. Ephemeral
        confirmation is lost on backend restart and superseded by new native turn evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityReset'
      responses:
        '200':
          description: Human-confirmed activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentActivity'
        default:
          description: Invalid confirmation, stale activity or identity, owned execution, or authentication/origin refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/workspaces/reset:
    post:
      operationId: resetWorkspace
      summary: Forget every registration and group on one checkout
      description: Lets the user start a workspace from scratch. Removes, in one transaction, all pairs and session
        registrations whose repository is the given worktree root. Refused while a run owns that worktree or an
        uncertain delivery holds it. Command history, run records and hook events are kept; no process is touched
        and nothing is written to Git.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceReset'
      responses:
        '200':
          description: What was forgotten; empty lists when nothing was registered there
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResetResult'
        '400':
          description: Invalid body or missing confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: A run owns the worktree or a delivery there is in flight or uncertain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/pairs:
    post:
      operationId: createPair
      summary: Name two registered sessions that alternate on one worktree
      description: Grouping and validation only; no automation. Both sessions must be registered with the same repository
        root, so they share one index. Refused while that worktree is held.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairInput'
      responses:
        '200':
          description: Pair stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayPair'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: A named session is not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Different worktrees, duplicate pair name, or reserved turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: JSON media type required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/pairs/{id}:
    delete:
      operationId: removePair
      summary: Forget one pair
      description: Both sessions stay registered. Refused while the pair's worktree has a reserved turn.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AgentId'
      responses:
        '200':
          description: Pair removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveResult'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No pair with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The worktree is held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/events:
    post:
      operationId: recordTurnEvent
      summary: Record a turn-complete event from a CLI's own hook
      description: Called by hooks/codercrew-turn-complete.sh, registered as Claude Code's Stop hook and Codex's notify
        command on the same host. The event is matched to a registered pane by exact tmux identity and tied to the
        last command delivered there. It is informational; it authorizes nothing, sends nothing, and never clears a
        hold. An event from an unregistered pane is kept so a misconfigured hook is visible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnEvent'
        '400':
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: JSON media type required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
      description: Random 256-bit host token (64 hex characters). Never include it in a URL.
  schemas:
    AgentId:
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$
      description: Lowercase slug derived from the registration label, e.g. codex or claude-code.
    AdapterMode:
      type: string
      enum:
      - mock
      - tmux
    AgentType:
      type: string
      enum:
      - codex
      - claude
      - other
      description: Which CLI the human says runs in the pane; suggested from the process name, confirmed at registration.
    DeliveryStatus:
      type: string
      enum:
      - recorded
      - sending
      - delivered
      - uncertain
      - rejected
    PaneIdentity:
      type: object
      properties:
        paneId:
          type: string
        panePid:
          type: string
        serverPid:
          type: string
        serverStarted:
          type: string
        socketPath:
          type: string
      required:
      - paneId
      - panePid
      - serverPid
      - serverStarted
      - socketPath
    SessionRegistration:
      type: object
      description: Exact instance binding or read-only proposal. Discovery can return unsaved proposals; Start and explicit name/membership edits validate and persist them.
      properties:
        registrationId:
          type: string
          format: uuid
        cwd:
          type: string
        worktree:
          oneOf:
          - $ref: '#/components/schemas/WorktreeIdentity'
          - type: 'null'
        id:
          $ref: '#/components/schemas/AgentId'
        label:
          type: string
        agentType:
          $ref: '#/components/schemas/AgentType'
        repository:
          type: string
          description: Real path of the worktree root. Sessions sharing it form one project and one reservation scope.
        expectedCommand:
          type: string
          description: Foreground process name observed at registration; a native CLI may report a version string. Never a
            shell or generic interpreter.
        identity:
          $ref: '#/components/schemas/PaneIdentity'
        relayPrompt:
          type: string
        registeredAt:
          type: string
          format: date-time
        cliPid:
          type:
          - string
          - 'null'
          description: Foreground CLI process id pinned at registration; absent on legacy registrations.
      required:
      - id
      - label
      - agentType
      - repository
      - expectedCommand
      - identity
      - relayPrompt
      - registeredAt
    PanePreview:
      type: object
      properties:
        paneId:
          type: string
        text:
          type: string
        capturedAt:
          type: string
          format: date-time
      required:
      - paneId
      - text
      - capturedAt
    RelayPair:
      type: object
      description: Two registered sessions that alternate reviews on one worktree. Grouping and validation only.
      properties:
        id:
          $ref: '#/components/schemas/AgentId'
        name:
          type: string
        repository:
          type: string
        sessions:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/AgentId'
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - repository
      - sessions
      - createdAt
    PairInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Human name; its slug becomes the pair id.
        sessions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AgentId'
      required:
      - name
      - sessions
      additionalProperties: false
    Reservation:
      type: object
      description: A worktree with a command in flight or an unacknowledged uncertain delivery.
      properties:
        repository:
          type: string
        activeCommandId:
          type: string
          format: uuid
      required:
      - repository
      - activeCommandId
    EventInput:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/AgentType'
        event:
          type: string
          enum: [session_started, turn_started, turn_complete, turn_interrupted, outcome]
          description: turn_interrupted requires exact Codex session/turn, pane, CLI PID and start evidence; it cannot report settled completion or an outcome. It pauses an owned assignment without accepting a handoff.
        commandId:
          type: string
          format: uuid
        sourceTurnId:
          type: string
          maxLength: 200
        identity:
          $ref: '#/components/schemas/PaneIdentity'
        backgroundState:
          enum: [clear, active, unknown]
        prompt:
          type: string
          maxLength: 2000
        settled:
          type: boolean
        outcome:
          enum: [no_incoming_handoff, strong_objection, accept_without_improvement, accept_and_improve]
        reason:
          type: string
          maxLength: 500
        paneId:
          type: string
          pattern: ^%\d+$
          description: $TMUX_PANE inside the pane.
        socketPath:
          type: string
          description: First field of $TMUX; matched when present.
        cwd:
          type: string
        sessionId:
          type: string
          maxLength: 200
          description: The CLI's own session or thread id, when its payload carries one.
        reporterPid:
          type: string
          pattern: ^\d{1,10}$
          description: Transient hook process id, excluded from process evidence.
        cliPid:
          type: string
          pattern: ^\d{1,10}$
          description: CLI foreground process captured at the native turn start.
        startedAt:
          type: string
          format: date-time
          description: Native start timestamp, retained unchanged by its completion for independent activity tracking.
      required:
      - source
      - event
      - paneId
      additionalProperties: false
    TurnEvent:
      type: object
      properties:
        prompt:
          type: [string, 'null']
        outcome:
          enum: [no_incoming_handoff, strong_objection, accept_without_improvement, accept_and_improve, null]
        reason:
          type: [string, 'null']
        outcomeState:
          enum: [reported, pending, none]
        agentId:
          oneOf:
          - $ref: '#/components/schemas/AgentId'
          - type: 'null'
          description: The registered session the event matched, or null for an unregistered pane.
        paneId:
          type: string
        source:
          $ref: '#/components/schemas/AgentType'
        sessionId:
          type:
          - string
          - 'null'
        commandId:
          type:
          - string
          - 'null'
          format: uuid
          description: The last command delivered to that session before the event, if any.
        receivedAt:
          type: string
          format: date-time
      required:
      - agentId
      - paneId
      - source
      - sessionId
      - commandId
      - receivedAt
      - prompt
      - outcome
      - reason
      - outcomeState
    AvailablePane:
      type: object
      description: One live pane on the configured tmux server, for the human to choose. Not a readiness or lifecycle signal.
      properties:
        identity:
          $ref: '#/components/schemas/PaneIdentity'
        command:
          type: string
        cwd:
          type: string
        dead:
          type: boolean
        inMode:
          type: boolean
        synchronized:
          type: boolean
        location:
          type: string
          description: Current session:window.pane; informational and may change.
        registeredAs:
          oneOf:
          - $ref: '#/components/schemas/AgentId'
          - type: 'null'
      required:
      - identity
      - command
      - cwd
      - dead
      - inMode
      - synchronized
      - location
      - registeredAs
    WorktreeIdentity:
      type: object
      description: Canonical Git worktree root, git directory and index path. Linked worktrees of one repository have distinct identities.
      properties:
        root:
          type: string
        gitDir:
          type: string
        indexPath:
          type: string
      required:
      - root
      - gitDir
      - indexPath
    WorkspaceAgent:
      type: object
      description: One live pane inside a discovered workspace. Read-only inventory, not a registration, lifecycle or readiness signal.
      properties:
        identity:
          $ref: '#/components/schemas/PaneIdentity'
        location:
          type: string
          description: Current session:window.pane; informational and may change.
        command:
          type: string
        kind:
          type: string
          enum:
          - codex
          - claude
          - other
          - shell
          description: How the foreground process was classified. Only codex and claude can be group members.
        eligible:
          type: boolean
          description: A known coding CLI in a safe pane. Shells, unidentified processes and dead, copy-mode or synchronized panes are not.
        reason:
          type:
          - string
          - 'null'
        label:
          type: string
          description: The saved label when registered; coding CLIs otherwise default to the tmux session name, with pane identity kept separate.
        session:
          $ref: '#/components/schemas/SessionRegistration'
          description: Read-only identity proposal for an eligible pane; persisted only by an explicit name/membership edit or Start. Discovery never registers or dispatches.
        registeredAs:
          oneOf:
          - $ref: '#/components/schemas/AgentId'
          - type: 'null'
      required:
      - identity
      - location
      - command
      - kind
      - eligible
      - reason
      - label
      - registeredAs
    Workspace:
      type: object
      description: A canonical current working directory inside a Git worktree with the live panes found there on one tmux server.
      properties:
        cwd:
          type: string
        socketPath:
          type: string
        worktree:
          $ref: '#/components/schemas/WorktreeIdentity'
        branch:
          type:
          - string
          - 'null'
          description: The checked-out branch, or null on a detached HEAD.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceAgent'
        group:
          description: All eligible pane IDs included by default. Users may exclude any member; saved selection and execution support are separate.
          oneOf:
          - type: array
            items:
              type: string
            minItems: 1
          - type: 'null'
        git:
          $ref: '#/components/schemas/WorkspaceGit'
        gitError:
          type: string
        sharesIndexWith:
          type: array
          items:
            type: string
          description: Other workspace directories that resolve to this worktree and index; they cannot run conflicting work.
      required:
      - cwd
      - socketPath
      - worktree
      - branch
      - agents
      - group
      - sharesIndexWith
    SkippedDirectory:
      type: object
      properties:
        cwd:
          type: string
        panes:
          type: integer
        reason:
          type: string
      required:
      - cwd
      - panes
      - reason
    WorkspaceDiscovery:
      type: object
      properties:
        projects:
          type: array
          description: Project-centered inventory. Optional for older clients; always returned by the project-aware server.
          items:
            $ref: '#/components/schemas/Project'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedDirectory'
          description: Directories with live panes that are not inside a Git worktree or could not be inspected.
        error:
          type:
          - string
          - 'null'
          description: Set when the pane listing itself failed, e.g. no tmux server.
        discoveredAt:
          type: string
          format: date-time
      required:
      - workspaces
      - skipped
      - error
      - discoveredAt
    Project:
      type: object
      required: [id, name, commonDir, directoryName, worktrees, error, creations]
      properties:
        id: { type: string, description: Host-local identity derived from the canonical Git common directory. }
        name: { type: string }
        commonDir: { type: string }
        directoryName: { type: string, description: Safe task-root namespace; same-named separate clones get disambiguated names. }
        worktrees:
          type: array
          items:
            $ref: '#/components/schemas/ProjectWorktree'
        error: { type: [string, 'null'] }
        creations:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeCreation'
        removals:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeRemoval'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeIntegration'
        discards:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeDiscard'
    ProjectWorktree:
      type: object
      required: [id, path, branch, head, main, identity, error]
      properties:
        id: { type: string, description: Independent of branch; derived from canonical worktree metadata and index. }
        path: { type: string }
        branch: { type: [string, 'null'] }
        head: { type: [string, 'null'] }
        main: { type: boolean }
        identity:
          oneOf:
          - $ref: '#/components/schemas/WorktreeIdentity'
          - type: 'null'
        error: { type: [string, 'null'], description: Missing or inaccessible worktrees stay visible but cannot be used as setup sources. }
    WorktreePreviewInput:
      type: object
      additionalProperties: false
      required: [projectId, sourceWorktreeId, branch]
      properties:
        projectId: { type: string }
        sourceWorktreeId: { type: string }
        branch: { type: string, maxLength: 150, pattern: '^[A-Za-z0-9][A-Za-z0-9/_.-]*$' }
    WorktreePreview:
      type: object
      required: [projectId, sourceWorktreeId, branch, requestId, source, sourceBranch, sourceHead, path]
      properties:
        projectId: { type: string }
        sourceWorktreeId: { type: string }
        branch: { type: string }
        requestId: { type: string, format: uuid }
        source:
          $ref: '#/components/schemas/WorktreeIdentity'
        sourceBranch: { type: [string, 'null'] }
        sourceHead: { type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$' }
        path: { type: string, description: Canonical proposed path under the host task-worktree root. }
    WorktreeCreateInput:
      allOf:
      - $ref: '#/components/schemas/WorktreePreview'
      - type: object
        required: [confirm]
        properties:
          confirm: { type: boolean, const: true }
      unevaluatedProperties: false
    WorktreeCreation:
      type: object
      required: [input, status, message, updatedAt]
      properties:
        input:
          $ref: '#/components/schemas/WorktreeCreateInput'
        status: { type: string, enum: [applying, ready, uncertain, failed] }
        message: { type: string }
        updatedAt: { type: string, format: date-time }
    WorktreeRemovalInput:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
    WorktreeRemovalPreview:
      type: object
      required: [projectId, worktreeId, requestId, worktree, branch, head, targetRef, targetHead, integratedBy, integratedCommit]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        requestId: {type: string, format: uuid}
        worktree: {$ref: '#/components/schemas/WorktreeIdentity'}
        branch: {type: string}
        head: {type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'}
        targetRef: {type: string}
        targetHead: {type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'}
        integratedBy: {type: string, enum: [ancestry, squash]}
        integratedCommit: {type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'}
    WorktreeRemoveInput:
      allOf:
      - $ref: '#/components/schemas/WorktreeRemovalPreview'
      - type: object
        required: [confirm]
        properties:
          confirm: {type: boolean, const: true}
      unevaluatedProperties: false
    WorktreeRemoval:
      type: object
      required: [input, status, message, updatedAt]
      properties:
        input: {$ref: '#/components/schemas/WorktreeRemoveInput'}
        status: {type: string, enum: [applying, removed, uncertain, failed]}
        message: {type: string}
        updatedAt: {type: string, format: date-time}
    WorktreeIntegrationInput:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        through: {type: string, pattern: '^[0-9a-fA-F]{7,64}$', description: Inclusive task-branch endpoint; omit for HEAD.}
    WorktreeIntegrationPreview:
      type: object
      required: [projectId, worktreeId, requestId, worktree, branch, head, through, previousCommit, dirty, targetRef, targetHead, target, mergeBase, commitCount, commits, tree, message, commands, consent]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        requestId: {type: string, format: uuid}
        worktree: {$ref: '#/components/schemas/WorktreeIdentity', description: The task worktree; it is not modified.}
        branch: {type: string}
        head: {$ref: '#/components/schemas/GitSha', description: Current task HEAD pinned separately from the batch endpoint.}
        through: {$ref: '#/components/schemas/GitSha', description: Resolved inclusive endpoint of this batch.}
        previousCommit: {type: [string, 'null'], description: Previous verified squash on the target or null for the first batch.}
        dirty: {type: boolean, description: Uncommitted task-worktree changes exist and are not part of the squash.}
        targetRef: {type: string}
        targetHead: {$ref: '#/components/schemas/GitSha'}
        target: {$ref: '#/components/schemas/WorktreeIdentity', description: The clean checkout with the integration branch checked out, where the squash commit is made.}
        mergeBase: {$ref: '#/components/schemas/GitSha', description: Exclusive batch base; the previous integrated source endpoint or the initial merge base.}
        commitCount: {type: integer, minimum: 1}
        commits:
          type: array
          maxItems: 100
          description: Up to 100 of the commits being squashed, newest first.
          items:
            type: object
            additionalProperties: false
            required: [sha, subject]
            properties:
              sha: {$ref: '#/components/schemas/GitSha'}
              subject: {type: string}
        tree: {$ref: '#/components/schemas/GitSha', description: The conflict-free merged tree; the squash commit must have exactly this tree.}
        message: {type: string, description: Editable default commit message, generated within the confirmation budget (at most 8 KiB once JSON-encoded, subjects shortened and the list cut with a count of omitted commits).}
        commands: {type: array, maxItems: 4, items: {type: string}, description: The exact Git operations confirmation authorizes, for display.}
        consent: {type: string, pattern: '^[0-9a-f]{64}$', description: Server digest of every pinned field except requestId and message.}
    WorktreeIntegrateRequest:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId, requestId, consent, message, confirm]
      description: Compact confirmation; the server re-derives the preview and requires its consent digest to match.
      properties:
        projectId: {type: string, maxLength: 200}
        worktreeId: {type: string, maxLength: 200}
        through: {$ref: '#/components/schemas/GitSha', description: Repeat the preview endpoint; omit only for a full-HEAD preview.}
        requestId: {type: string, format: uuid}
        consent: {type: string, pattern: '^[0-9a-f]{64}$'}
        message: {type: string, description: Printable, newlines allowed, at most 8192 bytes once JSON-encoded (escapes count), so every accepted request stays within the 16 KiB body limit together with the bounded identifiers.}
        confirm: {type: boolean, const: true}
    WorktreeIntegrateInput:
      description: The durable consent record, the re-derived preview with the confirmed message.
      allOf:
      - $ref: '#/components/schemas/WorktreeIntegrationPreview'
      - type: object
        required: [confirm]
        properties:
          confirm: {type: boolean, const: true}
      unevaluatedProperties: false
    WorktreeIntegration:
      type: object
      required: [input, status, message, updatedAt, commit]
      properties:
        input: {$ref: '#/components/schemas/WorktreeIntegrateInput'}
        retired: {type: boolean, description: Historical result retained after removal or discard; no longer a batch checkpoint.}
        status: {type: string, enum: [applying, integrated, uncertain, failed]}
        message: {type: string}
        updatedAt: {type: string, format: date-time}
        commit: {type: [string, 'null'], description: The verified squash commit on the integration branch.}
    WorktreeDiscardInput:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
    WorktreeDiscardPreview:
      type: object
      required: [projectId, worktreeId, requestId, worktree, branch, head, targetRef, targetHead, dirty, changeCount, fingerprint, unmergedCommits]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        requestId: {type: string, format: uuid}
        worktree: {$ref: '#/components/schemas/WorktreeIdentity'}
        branch: {type: string}
        head: {$ref: '#/components/schemas/GitSha'}
        targetRef: {type: string}
        targetHead: {$ref: '#/components/schemas/GitSha'}
        dirty: {type: boolean}
        changeCount: {type: integer, minimum: 0, description: Modified or nonignored untracked files that would be lost.}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of HEAD, index entries, unstaged content and untracked file contents; consent binds to this exact content.}
        unmergedCommits: {type: integer, minimum: 0, description: Commits the integration branch does not contain; unreachable once the branch is deleted.}
    WorktreeDiscardConfirm:
      allOf:
      - $ref: '#/components/schemas/WorktreeDiscardPreview'
      - type: object
        required: [confirmBranch, confirm]
        properties:
          confirmBranch: {type: string, description: Must equal branch exactly.}
          confirm: {type: boolean, const: true}
      unevaluatedProperties: false
    WorktreeDiscard:
      type: object
      required: [input, status, message, updatedAt]
      properties:
        input: {$ref: '#/components/schemas/WorktreeDiscardConfirm'}
        status: {type: string, enum: [applying, discarded, uncertain, failed]}
        message: {type: string}
        updatedAt: {type: string, format: date-time}
        branchRemains: {type: boolean, description: Set by inspection when the directory and worktree entry are gone and the branch is at the confirmed head; a confirmed finish may delete it.}
    ActivityReset:
      type: object
      required: [agentId, registrationId, expectedUpdatedAt, confirmReady]
      additionalProperties: false
      properties:
        agentId: {type: string}
        registrationId: {type: string, format: uuid}
        expectedUpdatedAt: {type: [string, 'null'], format: date-time}
        confirmReady: {const: true}
    WorkspaceReset:
      type: object
      properties:
        repository:
          type: string
          description: Absolute canonical worktree root, as shown on the workspace card.
        confirmReady:
          type: boolean
          const: true
      required:
      - repository
      - confirmReady
    WorkspaceResetResult:
      type: object
      properties:
        groups:
          type: array
          items:
            type: string
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AgentId'
        pairs:
          type: array
          items:
            type: string
      required:
      - sessions
      - pairs
      - groups
    RenameSession:
      type: object
      properties:
        label: {type: string, minLength: 1, maxLength: 40}
        expectedLabel: {type: string, minLength: 1, maxLength: 40}
        expectedRegistrationId: {type: string, format: uuid}
      required: [label, expectedLabel, expectedRegistrationId]
      additionalProperties: false
    RegistrationInput:
      type: object
      properties:
        paneId:
          type: string
          pattern: ^%\d+$
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: Human label; its slug becomes the agent id.
        agentType:
          $ref: '#/components/schemas/AgentType'
        repository:
          type: string
          description: Absolute path; defaults to the pane's current directory.
        relayPrompt:
          type: string
          minLength: 1
          maxLength: 2000
          description: Single-line prompt sent by Relay; defaults to "relay".
      required:
      - paneId
      - label
      additionalProperties: false
    RegistrationResult:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/SessionRegistration'
        replaced:
          type: boolean
          description: True when an existing registration with the same id was re-pointed at this pane.
      required:
      - session
      - replaced
    RemoveResult:
      type: object
      properties:
        removed:
          type: boolean
          const: true
      required:
      - removed
    Snapshot:
      type: object
      properties:
        agentId:
          $ref: '#/components/schemas/AgentId'
        text:
          type: string
        capturedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - available
          - unavailable
        error:
          type: string
      required:
      - agentId
      - text
      - capturedAt
      - status
      description: A replaceable bounded screen capture, not a transcript or lifecycle/completion event.
    CommandRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        agentId:
          $ref: '#/components/schemas/AgentId'
        kind:
          type: string
          enum:
          - relay
          - instruction
        text:
          type: string
        handoff:
          type: boolean
          description: Whether finishing this command hands off to the relay partner. Always true for a relay.
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        releasedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - agentId
      - kind
      - text
      - handoff
      - status
      - createdAt
      - updatedAt
      - error
      - releasedAt
    HistoryCommand:
      allOf:
      - $ref: '#/components/schemas/CommandRecord'
      - type: object
        properties:
          runId:
            type:
            - string
            - 'null'
            description: The server run this command belonged to, from the durable ledger; null when it predates the ledger.
          pairId:
            type:
            - string
            - 'null'
            description: The pair frozen into that run, for history filtering; null for a single-agent turn.
          groupId:
            type: [string, 'null']
            description: Implementation group identity, or the preserved legacy pair identity.
        required:
        - runId
        - pairId
        - groupId
    ConsoleState:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        legacyEnabled:
          type: boolean
          description: Host opt-in for new deprecated staging runs; false by default. Existing runs retain their protocol.
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RelayRun'
        executions:
          type: array
          items:
            $ref: '#/components/schemas/Execution'
        mode:
          $ref: '#/components/schemas/AdapterMode'
        inputEnabled:
          type: boolean
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionRegistration'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/InstanceState'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/AgentActivity'
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/RelayPair'
        panes:
          type: array
          items:
            $ref: '#/components/schemas/AvailablePane'
        panesError:
          type:
          - string
          - 'null'
          description: Set when the pane listing itself failed, e.g. no tmux server; sessions may still be listed.
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/HistoryCommand'
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
        turns:
          type: array
          items:
            $ref: '#/components/schemas/TurnEvent'
          description: Latest turn-complete event per registered session, plus the latest unmatched one.
        serverTime:
          type: string
          format: date-time
      required:
      - mode
      - inputEnabled
      - sessions
      - instances
      - panes
      - panesError
      - pairs
      - snapshots
      - commands
      - reservations
      - turns
      - serverTime
      - groups
      - legacyEnabled
      - runs
      - executions
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    ReleaseInput:
      type: object
      properties:
        expectedCommandId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        confirmReady:
          const: true
          type: boolean
      required:
      - expectedCommandId
      - confirmReady
    ReleaseResult:
      type: object
      properties:
        released:
          type: boolean
          const: true
      required:
      - released
    CommandInput:
      oneOf:
      - type: object
        properties:
          requestId:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          agentId:
            $ref: '#/components/schemas/AgentId'
          confirmReady:
            type: boolean
            const: true
          kind:
            const: relay
            type: string
          pairId:
            $ref: '#/components/schemas/AgentId'
          autoContinue:
            type: boolean
          turnLimit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          text:
            type: string
            minLength: 1
            maxLength: 2000
            description: 'Optional context; the controller sends "<registered relay prompt>: <text>". Line breaks are allowed.'
        required:
        - requestId
        - agentId
        - confirmReady
        - kind
        additionalProperties: false
      - type: object
        properties:
          requestId:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          agentId:
            $ref: '#/components/schemas/AgentId'
          confirmReady:
            type: boolean
            const: true
          kind:
            const: instruction
            type: string
          pairId:
            $ref: '#/components/schemas/AgentId'
          autoContinue:
            type: boolean
          turnLimit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          text:
            type: string
            minLength: 1
            maxLength: 2000
            description: Nonblank input of one or more lines; maximum 2,000 UTF-8 bytes. CRLF is normalized to LF;
              other controls, DEL/C1 and Unicode line separators are rejected. Multi-line text reaches the terminal
              as one bracketed paste. The byte limit is stricter than maxLength for multibyte text.
          handoff:
            type: boolean
            description: When true, finishing this instruction hands off to the relay partner as an accepted-and-improved
              turn would; its result is the next thing to review. Default false.
        required:
        - requestId
        - agentId
        - confirmReady
        - kind
        - text
        additionalProperties: false
      description: A unique client UUID v4 is required. Same ID and payload returns the stored result without redelivery.
        Reuse with a different payload conflicts. Never retry automatically after an uncertain response.
    GitSha:
      type: "string"
      pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
    GitChange:
      type: object
      properties:
        status: {type: string, minLength: 2, maxLength: 2, description: 'Git porcelain columns: index then worktree; ?? means untracked.'}
        path: {type: string, description: Path relative to the worktree root.}
        originalPath: {type: [string, "null"], description: Rename or copy source path.}
      required: [status, path, originalPath]
      additionalProperties: false
    BranchState:
      type: "object"
      properties:
        branch: {"type":["string","null"]}
        head: {"$ref":"#/components/schemas/GitSha"}
        primary: {"type":["string","null"]}
        clean: {"type":"boolean"}
        changes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/GitChange'}}
        changeCount: {type: integer, minimum: 0, description: Total changed paths before truncating the displayed list to 100.}
      required: ["branch","head","primary","clean","changes","changeCount"]
      additionalProperties: false
    WorkspaceGit:
      description: The workspace branch reading plus the host's integration-branch policy. The default branch (origin/HEAD) and CODERCREW_INTEGRATION_BRANCHES are starting points, never implementation branches.
      type: object
      properties:
        branch: {type: [string, 'null']}
        head: {$ref: '#/components/schemas/GitSha'}
        primary: {type: [string, 'null']}
        clean: {type: boolean}
        changes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/GitChange'}}
        changeCount: {type: integer, minimum: 0, description: Total changed paths before truncating the displayed list to 100.}
        integration: {type: boolean, description: The checked-out branch is an integration branch. Implementation must create a task branch or task worktree from it.}
        taskBase:
          oneOf: [{$ref: '#/components/schemas/GitSha'}, {type: 'null'}]
          description: Where task work on this branch begins. The head when no commit lies beyond an integration tip, the single nearest merge base when known, null when the user must confirm it or the branch is an integration branch.
      required: [branch, head, primary, clean, changes, changeCount, integration, taskBase]
      additionalProperties: false
    BranchConsent:
      description: Staying on an existing task branch keeps its permanent task baseline; a new branch begins at head. An integration branch is refused as the implementation branch, and taskBase cannot accompany newBranch.
      type: "object"
      properties:
        branch: {"type":["string","null"]}
        head: {"$ref":"#/components/schemas/GitSha"}
        newBranch: {"type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9/_.-]{0,150}$"}
        taskBase: {"$ref":"#/components/schemas/GitSha","description":"Confirmed task baseline, an ancestor of head. When absent on an existing branch, the server infers it from integration tips or refuses ambiguous history. A new branch always begins at head."}
      required: ["branch","head"]
      additionalProperties: false
    Group:
      type: "object"
      properties:
        id: {"$ref":"#/components/schemas/AgentId"}
        name: {"type":"string"}
        repository: {"type":"string"}
        cwd: {"type":["string","null"]}
        members: {"type":"array","items":{"$ref":"#/components/schemas/AgentId"},"minItems":0,"uniqueItems":true, "description":"Selected eligible instances, including larger groups. Empty selection disables Start. Plan and Implementation execution currently require one or two members."}
        revision: {"type":"integer"}
        createdAt: {"type":"string","format":"date-time"}
        legacyPairId: {"type":["string","null"]}
      required: ["id","name","repository","cwd","members","revision","createdAt","legacyPairId"]
      additionalProperties: false
    GroupSelection:
      type: object
      properties:
        members: {type: array, minItems: 0, uniqueItems: true, items: {$ref: '#/components/schemas/AgentId'}}
        expectedRevision: {type: integer, minimum: 1}
        registrations: {type: object, additionalProperties: {type: string, format: uuid}}
      required: [members, expectedRevision, registrations]
      additionalProperties: false
    GroupInput:
      type: "object"
      properties:
        name: {"type":"string","minLength":1,"maxLength":40}
        members: {"type":"array","items":{"$ref":"#/components/schemas/AgentId"},"minItems":1,"uniqueItems":true}
      required: ["name","members"]
      additionalProperties: false
    StandaloneStart:
      type: object
      description: Plain Send; no commit or branch authorization is implied.
      properties:
        groupRevision: {"type":"integer","minimum":1}
        registrations: {"type":"object","minProperties":1,"maxProperties":2,"additionalProperties":{"type":"string","format":"uuid"}}
        requestId: {"type":"string","format":"uuid"}
        groupId: {"$ref":"#/components/schemas/AgentId"}
        agentId: {"$ref":"#/components/schemas/AgentId"}
        text: {"type":"string","maxLength":2000}
        policy: {"enum":["solo","peer","worker_reviewer"]}
        workerId: {"$ref":"#/components/schemas/AgentId"}
        confirmReady: {"const":true}
      required: [requestId, groupId, groupRevision, registrations, agentId, text, policy, confirmReady]
      additionalProperties: false
    ReviewPreviewInput:
      type: object
      properties:
        groupId: {$ref: '#/components/schemas/AgentId'}
        head: {$ref: '#/components/schemas/GitSha'}
        logPath: {type: string, maxLength: 200, description: 'Tracked journal mirror to exclude from project content, when the project keeps one.'}
        base: {$ref: '#/components/schemas/GitSha', description: 'Excluded ancestor. Omit to derive it from recipient and taskBase, which are then required.'}
        recipient: {$ref: '#/components/schemas/AgentId', description: 'Group member who will review; the baseline is the newest first-parent commit at which the journal records a completed turn of theirs.'}
        taskBase: {$ref: '#/components/schemas/GitSha', description: 'Fallback baseline when the recipient has no journal entry on this chain.'}
        commitPending: {type: boolean, default: false, description: 'Preview the committed portion before a pending snapshot; permits HEAD and empty committed ranges.'}
      required: [groupId, head]
      additionalProperties: false
    ReviewPreview:
      type: object
      properties:
        base: {$ref: '#/components/schemas/GitSha'}
        baseSubject: {type: string, description: 'Subject of the baseline commit.'}
        head: {$ref: '#/components/schemas/GitSha'}
        since: {enum: [explicit, recipient, task], description: 'Origin of the baseline.'}
        commits:
          type: array
          maxItems: 100
          description: Every commit in base..head, newest first.
          items:
            type: object
            properties:
              sha: {$ref: '#/components/schemas/GitSha'}
              subject: {type: string}
            required: [sha, subject]
            additionalProperties: false
        candidates:
          type: array
          maxItems: 101
          description: Baselines a human may choose, earliest first — base, then HEAD's first-parent ancestors after it through HEAD's parent, or HEAD when commitPending is true.
          items:
            type: object
            properties:
              sha: {$ref: '#/components/schemas/GitSha'}
              subject: {type: string}
            required: [sha, subject]
            additionalProperties: false
      required: [base, baseSubject, head, since, commits, candidates]
      additionalProperties: false
    ImplementationStart:
      type: "object"
      properties:
        groupRevision: {"type":"integer","minimum":1}
        registrations: {"type":"object","minProperties":1,"maxProperties":2,"additionalProperties":{"type":"string","format":"uuid"}}
        requestId: {"type":"string","format":"uuid"}
        groupId: {"$ref":"#/components/schemas/AgentId"}
        agentId: {"$ref":"#/components/schemas/AgentId"}
        kind: {"enum":["work","commit","review"],"description":"commit snapshots all current changes without implementing pending requests; optional text is handoff context. With handoff=true, two participants review from reviewBase through the new snapshot after validated publication. Without handoff, autoContinue must be false; solo commits never relay. reviewBase is required for review and optional for commit with handoff (defaults to the pre-snapshot HEAD)."}
        text: {"type":"string","maxLength":2000}
        handoff: {"type":"boolean"}
        policy: {"enum":["solo","peer","worker_reviewer"]}
        workerId: {"$ref":"#/components/schemas/AgentId"}
        autoContinue: {"type":"boolean"}
        turnLimit: {"type":"integer","minimum":1,"maximum":200}
        pauseOnObjection: {"type":"boolean","description":"Agreement: a reviewer objection pauses for the human instead of routing to the author. Default false."}
        logPath: {"type":"string","maxLength":200,"description":"Explicit project preference: also mirror every journal entry into this tracked, nonignored JSON-lines file inside the handoff commit, so report-only turns commit too. Absent (default), the journal lives only in CoderCrew and report-only turns publish no commit."}
        branch: {"$ref":"#/components/schemas/BranchConsent"}
        reviewBase: {"$ref":"#/components/schemas/GitSha"}
        confirmReady: {"const":true}
      required: ["requestId","groupId","groupRevision","registrations","agentId","kind","handoff","policy","autoContinue","turnLimit","branch","confirmReady"]
      additionalProperties: false
    PolicyChange:
      type: "object"
      properties:
        runId: {"type":"string","format":"uuid"}
        expectedCommandId: {"type":"string","format":"uuid"}
        expectedRevision: {"type":"integer","minimum":1}
        policy: {"enum":["peer","worker_reviewer"]}
        workerId: {"$ref":"#/components/schemas/AgentId"}
        autoContinue: {"type":"boolean"}
        pauseOnObjection: {"type":"boolean","description":"Omitted keeps the run's current objection agreement."}
      required: ["runId","expectedCommandId","expectedRevision","policy","autoContinue"]
      additionalProperties: false
