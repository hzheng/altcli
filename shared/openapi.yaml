  /api/v1/projects/worktrees/removal/reconcile:
    post:
      operationId: inspectWorktreeRemoval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
      responses:
        '200':
          description: Read-only inspection; verified absence completes removal, unchanged original releases the hold as failed, otherwise uncertainty remains
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeRemoval'}
        '404': {description: Unknown removal request}
  /api/v1/projects/worktrees/integration/preview:
    post:
      operationId: previewWorktreeIntegration
      summary: Preview one squash commit without changing refs, index or checkout
      description: Requires a linked task worktree on a named non-integration branch, a clean checkout that has the integration branch (main, else the recorded default) checked out with a committer identity, an unambiguous merge base, and a conflict-free `git merge-tree` result that changes the target tree. Neither checkout is modified. Uncommitted task-worktree changes are reported, not squashed. Run or delivery ownership of either checkout refuses the preview. Agent panes in both checkouts, including subdirectories, need current settled native activity and clear process evidence; unknown evidence, background writers and unsupported processes refuse it. Shell panes require the root shell in the foreground and no task processes. Ordinary discovery uses configured Git status semantics, including filters and monitors. Squash-specific status/merge inspection refuses selected content filters (including initialized submodules), external filesystem-monitor hooks and configured merge drivers. Preview may create unreachable Git objects. Optional through selects an inclusive task-branch commit; omitted means HEAD. Applicable prior batches supply the next baseline; retired checkpoints and checkpoints outside the current source or target history are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeIntegrationInput'}
      responses:
        '200':
          description: Exact operation, commits, merged tree and an editable default commit message
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeIntegrationPreview'}
        '409': {description: Conflict, dirty or missing integration checkout, nothing to integrate, ambiguous baseline, occupied checkout or inaccessible worktree}
  /api/v1/projects/worktrees/integration:
    post:
      operationId: integrateWorktree
      summary: Confirmed squash integration
      description: The compact confirmation repeats the preview's consent digest and the (edited) message; the server re-derives the preview and refuses a changed digest. The message budget (8 KiB JSON-encoded) plus bounded identifiers keeps every accepted request within the 16 KiB body limit, and the generated default already fits it. It then revalidates ownership and writer evidence and stages the exact previewed merged tree via a streamed binary diff and `git apply --index --binary`, then runs `git commit -m <message>` in the integration checkout under the repository's normal hook policy. Writer evidence is rechecked before staging and before committing; a failed check after Git starts retains uncertain ownership. Later activity does not invalidate an already verified squash result. Exactly one new single-parent commit whose tree equals the previewed merge tree is verified; anything else is uncertain and never retried. The task branch and worktree are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeIntegrateRequest'}
      responses:
        '200':
          description: Durable integration result; uncertain results retain ownership and are never retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeIntegration'}
        '403': {description: Host input disabled}
        '409': {description: Changed consent, conflicting request or project setup owner}
  /api/v1/projects/worktrees/integration/reconcile:
    post:
      operationId: inspectWorktreeIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
      responses:
        '200':
          description: Read-only inspection. Missing or active writer evidence at entry in either checkout retains ownership. After the previewed historical commit is verified, later activity does not undo completion; releasing an attempt without that commit still rechecks writer evidence. A dirty integration checkout keeps the operation uncertain (the staged squash may still be pending). A clean checkout settles it — the previewed commit anywhere on the branch's first-parent chain since the pinned tip completes it, an unchanged tip or a tip that moved on without that commit releases the hold as failed; nothing is retried. Whenever ownership is retained, the record's message says why (writer or ownership evidence, uncommitted changes with whether the previewed commit is already on the branch, or unreadable Git evidence)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeIntegration'}
        '404': {description: Unknown integration request}
  /api/v1/projects/worktrees/integration/release:
    post:
      operationId: releaseWorktreeIntegration
      summary: Clear the hold of an uncertain squash by the human's recorded decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, confirm]
              properties:
                requestId: {type: string, format: uuid}
                confirm: {type: boolean, enum: [true]}
      responses:
        '200':
          description: For use when inspection cannot settle the squash. No writer, cleanliness or ownership check applies and no Git state changes. Read-only evidence decides the record — the previewed commit on the branch's first-parent chain since the pinned tip records it as integrated (a usable batch boundary); otherwise, including when Git evidence cannot be read, the hold is released as failed. A record that is not uncertain is returned unchanged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeIntegration'}
        '403': {description: Input is disabled on this host}
        '404': {description: Unknown integration request}
  /api/v1/projects/worktrees/update/preview:
    post:
      operationId: previewWorktreeUpdate
      summary: Preview aligning a task branch with main (update, rebase or reset) without changing refs, index or checkout
      description: mode (default update) chooses how. Update replays only the commits after the proven integrated boundary, skipping squashed work; rebase always starts after the merge base, like `git rebase main`, and refuses commits main already has; reset drops the branch's commits and uncommitted tracked changes, like `git reset --hard main`. The preview names the equivalent command and the exact steps that run instead. Reset allows a dirty checkout; it lists the commits that leave the branch (kept under the recovery ref) and the uncommitted tracked changes it discards, pins the content by fingerprint, keeps untracked and ignored files, and refuses untracked or ignored content where a deleted tracked file would be restored. Otherwise requires a linked task worktree on a named non-integration branch with a clean checkout, no stopped merge, rebase, cherry-pick, revert or bisect, no sparse checkout and no submodules in either tip. The target is the local integration branch (main, else the recorded default); nothing is fetched. A task HEAD the target contains fast-forwards. A branch fully proven integrated by squash evidence moves to the target tip; commits after the last applicable squash checkpoint, or after the single merge base when nothing is integrated, are replayed with `git merge-tree` (at most 100, linear only). A replay that conflicts or produces no change is refused. Replay needs a committer identity and refuses commit signing and non-default message encodings. The boundary, target and every replayed commit are inspected before the first merge calculation, and every generated tree (including the one the checkout writes) before the preview is returned. Selected content filters, external filesystem-monitor hooks and configured merge drivers are refused, including attributes that become effective only in the combined tree. A non-fast-forward update refuses a branch with an upstream or a remote-tracking copy of the same name. Untracked or ignored files in the way of incoming tracked files refuse it. Run or delivery ownership refuses the preview. Native activity and process evidence do not gate alignment; the human accepts concurrent editing risks. Update and Rebase advise stopping active editing and leave conflicts for manual resolution; Reset warns about permanent loss of uncommitted tracked changes. Preview may create unreachable Git objects.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeUpdateInput'}
      responses:
        '200':
          description: The exact boundary, replayed commits, resulting tree and Git operations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeUpdatePreview'}
        '409': {description: Dirty, busy, published or unsupported worktree, already current, ambiguous baseline, replay conflict or redundant commit, local obstruction}
  /api/v1/projects/worktrees/update:
    post:
      operationId: updateWorktree
      summary: Confirmed update, rebase or reset of a task branch onto main
      description: The compact confirmation repeats the preview's mode and consent digest; the server re-derives the preview and refuses a changed digest. One confirmation accepts the previewed changes and concurrent editing risks; a reset does not require a typed branch name. After the archive step, reset requires the worktree content to still match the previewed fingerprint. Deleted or renamed paths are checked again for obstructions because ignored files are outside the fingerprint, and controller ownership is rechecked after those content reads. After creating the recovery ref, reset discards the uncommitted tracked changes with `git reset --hard HEAD`, moves with the same guarded checkout, and verifies tracked files only because untracked and ignored files stay. Inspection releases a reset whose changes were discarded but whose branch never moved. The claim is recorded in one transaction with the run ledger (a run or unresolved delivery on the worktree refuses it, and run starts refuse a worktree with an applying or uncertain update). Controller ownership is rechecked before and after re-deriving; native activity and process evidence are not prerequisites; published handoff content is archived in the journal. Replayed commits are written with `git commit-tree --no-gpg-sign`, keeping author, date and message, before anything visible changes. After a final ownership check it creates `refs/altcli/preserved/<requestId>` at the old tip (create-only) and runs `git checkout --no-overwrite-ignore --no-recurse-submodules -B <branch> <tip>` with hooks disabled. The branch attached and clean at the recorded tip, the preserved old tip, the previewed replay chain and the branch's previous value are verified; anything else after the first Git write is uncertain and never retried or rolled back. A verified update retires the worktree's squash checkpoints. Nothing is pushed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeUpdateRequest'}
      responses:
        '200':
          description: Durable update result; uncertain results retain ownership and are never retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeUpdate'}
        '400': {description: Missing confirmation or a mismatched optional legacy branch name}
        '403': {description: Host input disabled}
        '409': {description: Changed consent, conflicting request, project setup owner or run ownership}
  /api/v1/projects/worktrees/update/reconcile:
    post:
      operationId: inspectWorktreeUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
      responses:
        '200':
          description: Read-only inspection. The verified result, or a branch that has moved on from the recorded tip with the replay chain and preserved old tip intact, completes the operation. For reset, ancestry already present in the old history is not proof the reset ran, nor is a branch that still contains the dropped old tip (main merged by hand); later commits obscuring the exact result retain uncertainty. A checkout still at the old tip releases the hold as failed after checking controller ownership, when it is clean (update, rebase), unchanged from the previewed content (reset), or had its uncommitted changes discarded without moving (reset); a created recovery ref is kept and reported. Anything else retains ownership; nothing is retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeUpdate'}
        '404': {description: Unknown update request}
  /api/v1/projects/worktrees/rename/preview:
    post:
      operationId: previewWorktreeRename
      summary: Preview renaming a task branch in place
      description: Requires a linked task worktree on a named non-integration branch. The new name must be a valid, unused task branch name that is not an integration branch and does not clash with an existing branch by case or path prefix. A branch with an upstream or a remote-tracking copy of the same name, or a worktree in a stopped Git operation, is refused. Uncommitted work is allowed and pinned by content fingerprint. Native activity and process evidence do not block the preview; confirmation warns about concurrent Git work and agents still using the old branch name. The directory does not move.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeRenameInput'}
      responses:
        '200':
          description: The exact rename, the pinned content and the squash checkpoints that carry over
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeRenamePreview'}
        '409': {description: Same, taken, conflicting, integration or published name, busy worktree or inaccessible worktree}
  /api/v1/projects/worktrees/rename:
    post:
      operationId: renameWorktreeBranch
      summary: Confirmed branch rename
      description: The whole preview plus confirm:true is the consent; the server re-derives it around ownership checks and refuses any difference, including the content fingerprint. The human accepts the warning about concurrent Git work and agents still referring to the old branch name. Native activity and process evidence do not gate rename. Controller ownership is checked again after the final re-derivation, immediately before Git runs. The claim is recorded with the same run-ledger transaction as Update. It runs `git branch -m <branch> <newBranch>` (never -M) with hooks disabled and verifies the new name at the confirmed head, the old name gone and HEAD attached to the new name. Squash checkpoints follow the rename. Files, the directory, agents and tmux session names are unchanged; nothing is pushed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeRenameConfirm'}
      responses:
        '200':
          description: Durable rename result; uncertain results retain ownership and are never retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeRename'}
        '403': {description: Host input disabled}
        '409': {description: Changed worktree, conflicting request, project setup owner or run ownership}
  /api/v1/projects/worktrees/rename/reconcile:
    post:
      operationId: inspectWorktreeRename
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
      responses:
        '200':
          description: Read-only inspection. The verified rename completes it; the old name still at the confirmed head with no new name releases the hold as failed; anything else retains ownership. Nothing is retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeRename'}
        '404': {description: Unknown rename request}
  /api/v1/projects/worktrees/discard/preview:
    post:
      operationId: previewWorktreeDiscard
      summary: Read-only preview of what a forced discard would lose
      description: Requires a linked task worktree on a named non-integration branch with no pane, run owner, unresolved delivery or installed CLI hook/skill reference. Modified files and commits absent from the integration branch are counted and reported, not refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeDiscardInput'}
      responses:
        '200':
          description: Worktree, branch and the work that would be lost
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiscardPreview'}
        '409': {description: Occupied or inaccessible worktree, an integration-branch worktree, or one the host's installed CLI hooks or skill links still point into}
  /api/v1/projects/worktrees/discard:
    post:
      operationId: discardWorktree
      summary: Confirmed forced removal of a worktree and deletion of its branch
      description: The branch name must be repeated in confirmBranch. After revalidating the preview and occupancy and archiving unarchived handoff commits in the journal, runs `git worktree remove --force` and `git branch -D`. Run history is retained; the commits become unreachable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorktreeDiscardConfirm'}
      responses:
        '200':
          description: Durable discard result; uncertain results retain ownership and are never retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiscard'}
        '403': {description: Host input disabled}
        '409': {description: Conflicting request or project setup owner}
  /api/v1/projects/worktrees/discard/reconcile:
    post:
      operationId: inspectWorktreeDiscard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
      responses:
        '200':
          description: Read-only inspection; verified absence of directory, worktree entry and branch completes the discard, the unchanged original releases the hold as failed, and every other state is described in the message while uncertainty remains. When only the branch is left at the confirmed head, branchRemains marks that a confirmed finish may delete it
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiscard'}
        '404': {description: Unknown discard request}
  /api/v1/projects/worktrees/discard/finish:
    post:
      operationId: finishWorktreeDiscard
      summary: Confirmed completion of an uncertain discard whose worktree is gone while its branch remains
      description: Re-verifies live that the directory and Git worktree entry are absent and the branch is at the confirmed head, then runs only `git branch -D`. Any other state, including a moved branch, refuses without touching Git. Nothing is retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, confirm]
              properties:
                requestId: {type: string, format: uuid}
                confirm: {type: boolean, const: true}
      responses:
        '200':
          description: Durable discard result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorktreeDiscard'}
        '403': {description: Host input disabled}
        '404': {description: Unknown discard request}
        '409': {description: Not at the branch-only step, or already being finished}
  /api/v1/projects/worktrees/reconcile:
    post:
      operationId: reconcileTaskWorktree
      summary: Inspect an uncertain creation without any Git mutation
      description: Exact clean destination, branch and baseline verify success. Verified absence of destination, worktree entry and branch releases a failed operation. Partial, changed or unreadable results remain uncertain and owned. Applying operations are not reconciled while their caller is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        '200':
          description: Current or reconciled operation, without replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorktreeCreation'
        default:
          description: Invalid input, authentication/origin refusal or unknown operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/activities/reset:
    post:
      operationId: resetActivity
      summary: Restore Unknown activity to human-confirmed Ready
      description: Requires an inspected empty prompt with no background writers. Checks the exact current
        registration, CLI identity and activity timestamp. Refuses known activity, owned runs and pending
        deliveries. Preserves configuration; never sends input or changes workflow ownership. Ephemeral
        confirmation is lost on backend restart and superseded by new native turn evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityReset'
      responses:
        '200':
          description: Human-confirmed activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentActivity'
        default:
          description: Invalid confirmation, stale activity or identity, owned execution, or authentication/origin refusal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/workspaces/reset:
    post:
      operationId: resetWorkspace
      summary: Forget every registration and group on one checkout
      description: Lets the user start a workspace from scratch. Removes, in one transaction, all pairs and session
        registrations whose repository is the given worktree root. Refused while a run owns that worktree or an
        uncertain delivery holds it. Command history, run records and hook events are kept; no process is touched
        and nothing is written to Git.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceReset'
      responses:
        '200':
          description: What was forgotten; empty lists when nothing was registered there
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResetResult'
        '400':
          description: Invalid body or missing confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: A run owns the worktree or a delivery there is in flight or uncertain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/pairs:
    post:
      operationId: createPair
      summary: Name two registered sessions that alternate on one worktree
      description: Grouping and validation only; no automation. Both sessions must be registered with the same repository
        root, so they share one index. Refused while that worktree is held.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairInput'
      responses:
        '200':
          description: Pair stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayPair'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: A named session is not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Different worktrees, duplicate pair name, or reserved turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: JSON media type required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/pairs/{id}:
    delete:
      operationId: removePair
      summary: Forget one pair
      description: Both sessions stay registered. Refused while the pair's worktree has a reserved turn.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AgentId'
      responses:
        '200':
          description: Pair removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveResult'
        '400':
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No pair with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The worktree is held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/events:
    post:
      operationId: recordTurnEvent
      summary: Record correlated native lifecycle evidence
      description: Called by the host CLI hooks. Only exact command, prompt, session, source-turn and worker evidence can advance a run under its frozen policy. Active or unknown background evidence retains ownership. Later ordered completion observations do not resume a paused handoff; recheck requires an explicit action. Missing correlation is diagnostic only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Lifecycle receipt; completion remains pending until the exact settled completion is captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookReceipt'
        '400':
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Host/origin denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: JSON media type required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Host configuration incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
      description: Random 256-bit host token (64 hex characters). Never include it in a URL.
    globalAIReadCapability:
      type: http
      scheme: bearer
      description: Separate random eight-hour Global AI read capability held in this boot's memory and a private 0600 descriptor. It never accepts or reveals the owner token, and host restart invalidates it.
  schemas:
    ClearContextInput:
      type: object
      additionalProperties: false
      required: [requestId, agentId, registrationId, expectedActivityUpdatedAt, confirmReady]
      properties:
        requestId: {type: string, format: uuid}
        agentId: {$ref: '#/components/schemas/AgentId'}
        registrationId: {type: string, format: uuid}
        expectedActivityUpdatedAt: {type: [string, 'null'], format: date-time}
        confirmReady: {const: true, description: Human inspected an empty prompt and settled agent/background work and accepts loss of current conversation context. Does not reset activity or release any ownership.}
    ProjectRecord: {type: object, properties: {id: {type: string}, name: {type: string}, commonDir: {type: string}, directoryName: {type: string}, settings: {$ref: '#/components/schemas/RepositorySettings'}}, required: [id, name, commonDir, directoryName], additionalProperties: false}
    LaunchDefault: {type: object, properties: {profileId: {type: string}, count: {type: integer, minimum: 1, maximum: 6}}, required: [profileId, count], additionalProperties: false}
    RepositorySettings:
      type: object
      description: ADR-0024 registration of a repository. Pending until the owner confirms the base checkout, local integration branch and default agents; schema 19 never recorded them, so migration leaves every repository pending.
      additionalProperties: false
      required: [revision, confirmation, base, integrationBranch, launchDefaults, confirmedAt]
      properties:
        revision: {type: integer, minimum: 1, description: Compare-and-set revision for edits.}
        confirmation: {enum: [pending, confirmed]}
        base:
          description: The existing non-bare checkout the owner chose; any branch. Registration never makes it app-owned.
          oneOf:
          - {type: object, properties: {path: {type: string}, identity: {$ref: '#/components/schemas/WorktreeIdentity'}}, required: [path, identity], additionalProperties: false}
          - {type: 'null'}
        integrationBranch: {type: [string, 'null'], description: Selected local integration branch; distinct from the base checkout's current branch.}
        launchDefaults: {type: array, maxItems: 6, items: {$ref: '#/components/schemas/LaunchDefault'}}
        confirmedAt: {type: [string, 'null']}
    RepositorySettingsInput:
      type: object
      additionalProperties: false
      required: [projectId, expectedRevision, basePath, integrationBranch, launchDefaults]
      properties:
        projectId: {type: string}
        expectedRevision: {type: integer, minimum: 0, description: The settings revision edited; 0 for a repository not yet registered.}
        basePath: {type: string, description: Absolute directory of a non-bare checkout of this repository.}
        integrationBranch: {type: string, description: An existing local branch with a commit. Nothing is fetched or created.}
        launchDefaults: {type: array, maxItems: 6, items: {$ref: '#/components/schemas/LaunchDefault'}, description: 'Enabled profiles, each listed once; at most six instances in total.'}
        expected: {$ref: '#/components/schemas/ExpectedCheckout'}
    ManagedWorkspace:
      type: object
      description: A task workspace AltCLI created and recorded (ADR-0024). The record, not tmux or Git inventory, makes it managed; listing it does not verify its condition. Keyed by its creation request, so a recreated path is a different workspace.
      additionalProperties: false
      required: [id, projectId, worktreeId, path, identity, branch, baseline, expectedBranch, status, retiredBy, aligned, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string}
        worktreeId: {type: [string, 'null']}
        path: {type: string}
        identity:
          oneOf:
          - $ref: '#/components/schemas/WorktreeIdentity'
          - type: 'null'
        branch: {type: string, description: Branch created; creation provenance is never overwritten.}
        baseline: {type: string, description: Committed baseline the workspace started at.}
        expectedBranch: {type: string, description: Task branch expected checked out; a confirmed rename updates it.}
        status: {enum: [active, pending, retired], description: pending is a migrated creation whose identity no saved record proves; never treated as active.}
        retiredBy:
          oneOf:
          - {type: object, properties: {kind: {enum: [removal, discard, superseded]}, requestId: {type: [string, 'null']}, at: {type: string}}, required: [kind, requestId, at], additionalProperties: false}
          - {type: 'null'}
        aligned:
          oneOf:
          - {type: object, properties: {requestId: {type: string}, mode: {$ref: '#/components/schemas/WorktreeUpdateMode'}, commit: {type: [string, 'null']}, at: {type: string}}, required: [requestId, mode, commit, at], additionalProperties: false}
          - {type: 'null'}
