openapi: 3.1.0
info:
  title: AltCLI host API
  version: 0.1.0
  description: Host-resident tmux console with explicit Plan and Implementation phases, captured plans kept in the app data directory, committed handoffs recorded in an app-owned journal, and branch-scoped Stage relay (uncommitted review) on main or the default branch.
    Native iOS remains deferred. This contract and the JSON-only TypeScript types are maintained together.
servers:
- url: http://127.0.0.1:8787
  description: Local host; use the configured HTTPS Tailscale origin for remote access.
security:
- ownerToken: []
paths:
  /api/v1/sessions/clear-context:
    post:
      operationId: clearContext
      description: Explicitly send /clear alone to one exact current Claude Code or Codex CLI on any branch. Creates a delivery receipt, not a workflow turn. Refuses working agents, changed activity or identity, owned runs, setup, unresolved delivery and manual-input holds. Delivery is not proof that the CLI reset; duplicate or uncertain requests are never replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClearContextInput'}
      responses:
        '200': {description: Durable delivery receipt, content: {application/json: {schema: {$ref: '#/components/schemas/CommandRecord'}}}}
        '400': {description: Invalid or unsupported request, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Input disabled or access denied, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Changed, owned or uncertain state; inspect before proceeding, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /api/v1/launches/{id}/capture:
    get:
      operationId: captureLaunch
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses:
        '200': {description: Exact-identity captured text, content: {application/json: {schema: {type: object, properties: {text: {type: string}}, required: [text], additionalProperties: false}}}}
  /api/v1/projects:
    post: {"operationId":"addProject","description":"Explicit canonical repository entry. Input must be enabled; no Git or tmux mutation.","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ProjectRecord"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"path":{"type":"string"},"expected":{"$ref":"#/components/schemas/ExpectedCheckout"}},"required":["path"],"additionalProperties":false}}}}}
  /api/v1/projects/settings:
    post: {"operationId":"configureRepository","description":"ADR-0024: explicitly confirm a repository's base checkout (any non-bare checkout of it, on any branch), existing local integration branch and default agent profiles. Compare-and-set on the settings revision; refused while a setup, launch or Finish branch operation owns the repository. Metadata only: no Git, tmux or checkout change.","responses":{"200":{"description":"The registered repository with its confirmed settings","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ProjectRecord"}}}},"403":{"description":"Host input is disabled","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"409":{"description":"Changed, held, not this repository, or not a local branch; reload and confirm again","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RepositorySettingsInput"}}}}}
  /api/v1/directories:
    post: {"operationId": "listDirectory", "description": "Read-only, bounded listing of one host directory (immediate folders only) plus Git's classification of that directory, for choosing a project's starting checkout. Creates and changes nothing.", "responses": {"200": {"description": "Recorded result; never task readiness or acceptance", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DirectoryListing"}}}}, "409": {"description": "Changed, held or uncertain; inspect before proceeding", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"path": {"type": "string", "description": "Absolute; defaults to the host home directory."}, "hidden": {"type": "boolean"}}, "additionalProperties": false}}}}}
  /api/v1/projects/worktrees/finish/preview:
    post: {"operationId": "previewFinish", "description": "Read-only Finish branch preview for a linked task worktree: app-launched sessions with every pane, activity and processes, other panes, Git facts and hard refusals. Server-held; the digest binds the session-stop consent.", "responses": {"200": {"description": "Recorded result; never task readiness or acceptance", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FinishPreview"}}}}, "409": {"description": "Changed, held or uncertain; inspect before proceeding", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FinishInput"}}}}}
  /api/v1/projects/worktrees/finish:
    post: {"operationId": "confirmFinish", "description": "Close exactly the previewed, provably app-launched sessions by session ID, then settle, wait for survivors or for the Git step. Durable owner; duplicates return the record; nothing is retried.", "responses": {"200": {"description": "Recorded result; never task readiness or acceptance", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskFinish"}}}}, "409": {"description": "Changed, held or uncertain; inspect before proceeding", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FinishConfirm"}}}}}
  /api/v1/projects/worktrees/finish/continue:
    post: {"operationId": "continueFinish", "description": "Run the confirmed removal or discard as this finish's only admitted child. Compare-and-set on the finish revision.", "responses": {"200": {"description": "Recorded result; never task readiness or acceptance", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskFinish"}}}}, "409": {"description": "Changed, held or uncertain; inspect before proceeding", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FinishContinue"}}}}}
  /api/v1/projects/worktrees/finish/reconcile:
    post: {"operationId": "reconcileFinish", "description": "Read-only inspection of an uncertain step, a recorded human inspection decision, or stopping before the Git step (abandon). Never repeats a kill or Git command.", "responses": {"200": {"description": "Recorded result; never task readiness or acceptance", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TaskFinish"}}}}, "409": {"description": "Changed, held or uncertain; inspect before proceeding", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ApiError"}}}}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/FinishReconcile"}}}}}
  /api/v1/terminals:
    post: {"operationId":"openTerminal","description":"Mint a ten-second single-use ticket for first-frame WebSocket authentication. Opens only an observer.","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/TerminalConnection"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TerminalOpen"}}}}}
  /api/v1/terminals/{id}/keyboard:
    post: {"operationId":"decideKeyboard","description":"Independent writers share one durable server-wide manual-input period. Deliberate input admits a connection; release, lock, disconnect and restart never imply settlement. Global AI's own terminal is exempt: its grant returns manualSession null and joins no period, even while another terminal holds input or automation is in flight. Its literal input targets only its original pane; the read-only display client cannot redirect it through tmux navigation.","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/KeyboardResult"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/KeyboardInput"}}}},"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}]}
  /api/v1/terminals/{id}/input:
    post: {"operationId":"writeNativeInput","description":"At most 4096 bytes, exact generation and contiguous sequence. No uncertain replay. An image insertion shares the same sequence: the server rechecks the writer's actual pane and session, the registered Claude Code or Codex CLI and its directory, and the image, pins it, then writes one single-quoted absolute path as a bracketed paste, never Enter.","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"type":"object","properties":{"generation":{"type":"string","format":"uuid"},"seq":{"type":"integer","minimum":0}},"required":["generation","seq"],"additionalProperties":false}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"oneOf":[{"$ref":"#/components/schemas/NativeInput"},{"$ref":"#/components/schemas/NativeImageInput"}]}}}},"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}]}
  /api/v1/attachments:
    post:
      operationId: uploadImage
      description: 'One raw PNG or JPEG body (not multipart), with bounded JSON metadata in the x-altcli-upload header naming a client requestId, the canonical workspace root and an optional display name. Authentication precedes reading or allocation; a read-only host refuses. Limits: 10 MiB per image, 40 million pixels, two concurrent uploads, 512 MiB and 1,000 retained files per host. The server checks structure (not pixels) and stores the file privately under <data directory>/attachments. The receipt is a draft: it sends, inserts or grants nothing, and an unreferenced draft is reclaimed after 24 hours. Retrying the same requestId with identical bytes returns the stored receipt; different bytes conflict. Nothing retries automatically.'
      parameters:
      - {in: header, name: x-altcli-upload, required: true, schema: {type: string, maxLength: 2048}, description: 'JSON: {"requestId": UUID, "workspace": absolute path, "name"?: display label}'}
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, contentMediaType: image/png}}
          image/jpeg: {schema: {type: string, contentMediaType: image/jpeg}}
      responses:
        '200': {description: 'Stored draft image; not an insertion or evidence that a model read it', content: {application/json: {schema: {$ref: '#/components/schemas/AttachmentReceipt'}}}}
        '403': {description: 'Unauthenticated origin, or input disabled on this host', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '408': {description: 'The upload exceeded its time bound; nothing was stored', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: 'Unknown workspace, unsafe storage, upload in progress or request ID bound to another image', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: 'The image exceeds 10 MiB', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '415': {description: 'Not a structurally valid PNG or JPEG, a mismatched type, or an animated PNG', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '429': {description: 'Two uploads are already in progress', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '507': {description: 'Retained image storage is full; referenced images are never evicted and this version has no in-app release', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /api/v1/attachments/{id}:
    delete:
      operationId: removeImageDraft
      description: Removes an unreferenced draft upload and its file; idempotent. Refused once any possible use (a native insertion or an accepted start) is recorded. Allowed on a read-only host; it never deletes referenced history.
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'Removed, or already absent', content: {application/json: {schema: {type: object, properties: {ok: {const: true}, removed: {type: boolean}}, required: [ok, removed], additionalProperties: false}}}}
        '409': {description: 'The image may already have been used, or is still uploading', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /api/v1/global-ai:
    get: {"operationId":"observeGlobalAI","description":"Observes the optional user-operated Global AI instance, the enabled launch profiles A1 can launch (preview validates the choice again) and a bounded native capture. Never returns a credential; viewing starts nothing.","responses":{"200":{"description":"Observed instance metadata; process liveness is not login, model or readiness evidence","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GlobalAIObservation"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
    post: {"operationId":"operateGlobalAI","description":"preview captures a two-minute launch preview (profile, executable, arguments and private directory; reads cover every project on the host). start confirms it once per requestId; the record precedes every process effect and an uncertain start is never retried or adopted. revoke invalidates the read capability at once without stopping the CLI. refresh-tools explicitly reauthorizes read access for this boot while the observed instance still matches. retire revokes tools and frees the app slot without stopping tmux or erasing provider history; with stop: true it first ends the exact, verified Global AI tmux session (restart), refuses extra panes/windows and disabled host input/launch, and retires nothing if the stop cannot be verified. An unverified stop response does not prove the process is still running. read returns owner evidence through the same read model.","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"action":{"enum":["preview","start","revoke","refresh-tools","retire","read"]},"profileId":{"type":"string"},"id":{"type":"string","format":"uuid"},"digest":{"type":"string","maxLength":64},"requestId":{"type":"string","format":"uuid"},"instanceId":{"type":"string","format":"uuid"},"confirm":{"const":true},"stop":{"const":true},"name":{"type":"string"},"arguments":{"type":"object"}},"required":["action"],"additionalProperties":false}}}},"responses":{"200":{"description":"preview: GlobalAIPreview; start, refresh-tools and retire: GlobalAIView; revoke: Ok; read: GlobalAIToolReply. A duplicate start returns the recorded instance without replaying its launch.","content":{"application/json":{"schema":{"oneOf":[{"$ref":"#/components/schemas/GlobalAIPreview"},{"$ref":"#/components/schemas/GlobalAIView"},{"$ref":"#/components/schemas/Ok"},{"$ref":"#/components/schemas/GlobalAIToolReply"}]}}}},"400":{"description":"Invalid action-specific fields or missing confirmation","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"403":{"description":"Global AI needs tmux mode with input, native terminal and agent-launch flags; or the owner origin was refused","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"404":{"description":"Unknown read tool, document or run","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"409":{"description":"Stale preview, changed profile/environment/scope, an existing instance, conflicting request ID, changed identity or revoked renewal","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"413":{"description":"The read exceeds its 128 KiB bound","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/global-ai/tools:
    post: {"operationId":"readGlobalAITools","security":[{"globalAIReadCapability":[]}],"description":"Loopback bridge endpoint for the Global AI stdio MCP server, not the owner API. Requires this host's exact loopback Host and Origin and the eight-hour read capability; authorization precedes body parsing and is rechecked after awaited reads. At most four reads are in flight.","requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"method":{"enum":["list","call"]},"name":{"enum":["get_capabilities","list_workspaces","list_runs","get_run","get_recent_events","search_docs","read_doc"]},"arguments":{"type":"object"}},"required":["method"],"additionalProperties":false}}}},"responses":{"200":{"description":"list: {tools}; call: GlobalAIToolReply. Recorded facts with explicit unknowns, not approval","content":{"application/json":{"schema":{"oneOf":[{"type":"object","properties":{"tools":{"type":"array","items":{"type":"object"}}},"required":["tools"],"additionalProperties":false},{"$ref":"#/components/schemas/GlobalAIToolReply"}]}}}},"400":{"description":"Invalid method or arguments","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"401":{"description":"Missing, revoked, expired or previous-boot capability","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"403":{"description":"Foreign Host/Origin","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"404":{"description":"Unknown tool, document or run","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"413":{"description":"The read exceeds its 128 KiB bound","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"429":{"description":"Four reads are already in flight","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/terminals/{id}/resize:
    post: {"operationId":"resizeTerminal","description":"At most one resize per connection per 100 ms, with one native inspection in flight. Dimensions clamp to 20–500 columns and 5–200 rows.","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}},"429":{"description":"Resize frequency or concurrency limit reached; wait for the viewport to settle.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"generation":{"type":"string","format":"uuid"},"cols":{"type":"integer","minimum":1,"maximum":10000},"rows":{"type":"integer","minimum":1,"maximum":10000}},"required":["generation","cols","rows"],"additionalProperties":false}}}},"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}]}
  /api/v1/terminals/{id}/close:
    post: {"operationId":"closeTerminal","description":"","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{},"required":[],"additionalProperties":false}}}},"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}]}
  /api/v1/terminals/revoke:
    post: {"operationId":"revokeBrowserTerminals","description":"","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ok"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"clientInstanceId":{"type":"string","format":"uuid"}},"required":["clientInstanceId"],"additionalProperties":false}}}}}
  /api/v1/terminals/stop:
    post: {"operationId":"stopTerminalWriters","description":"Stops exact connection generations. Plain stop tolerates newer byte revisions and retains the barrier. Optional strict settlement requires exact period and writer revisions; command-bound handoff additionally requires the full writer set and no affected checkpoints.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/KeyboardBatch"}}}},"responses":{"200":{"description":"Recorded manual-input period; not workflow approval.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualSession"}}}},"409":{"description":"Writer set or input changed; inspect before continuing."}}}
  /api/v1/terminals/reconcile:
    post: {"operationId":"reconcileManualInput","description":"Strict settled check or explicit human inspection with a bounded note acknowledging possible prior and background effects. Releases only the addressed manual period; other periods, run holds, checkpoints and faults remain. Live keyboard or unresolved delivery/setup/launch refuses reconciliation.","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualSession"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualReconcile"}}}}}
  /api/v1/launch-profiles:
    get: {"operationId":"listLaunchProfiles","description":"","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/LaunchProfile"}}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
    post: {"operationId":"createLaunchProfile","description":"","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchProfile"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchProfileInput"}}}}}
  /api/v1/launch-profiles/{id}:
    patch: {"operationId":"updateLaunchProfile","description":"","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchProfile"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchProfileInput"}}}},"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}]}
    delete: {"operationId":"deleteLaunchProfile","description":"","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"type":"object","properties":{"removed":{"type":"boolean"}},"required":["removed"],"additionalProperties":false}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"expectedRevision":{"type":"integer","minimum":0}},"required":["expectedRevision"],"additionalProperties":false}}}},"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}]}
  /api/v1/launches/preview:
    post: {"operationId":"previewLaunch","description":"","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchPreview"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchPreviewInput"}}}}}
  /api/v1/launches:
    get: {"operationId":"listLaunches","description":"","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/LaunchBatch"}}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
    post: {"operationId":"confirmLaunch","description":"Confirms a captured two-minute preview. Reservation precedes every possible effect; repeated confirmations never spawn again.","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchBatch"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"requestId":{"type":"string","format":"uuid"},"previewDigest":{"type":"string"},"confirm":{"const":true}},"required":["requestId","previewDigest","confirm"],"additionalProperties":false}}}}}
  /api/v1/launches/{id}/cleanup/preview:
    post: {"operationId":"previewLaunchCleanup","description":"Read-only preview of one recorded app session. Dead or missing sessions can be cleaned up; a live session can be closed with explicit stop acknowledgement. Replaced, shared or expanded sessions are refused. No removal by name.","parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Recorded result; never task completion","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchCleanupPreview"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/launches/{id}/cleanup:
    post: {"operationId":"confirmLaunchCleanup","description":"Confirm the exact cleanup preview. A live preview additionally requires confirmStop: true, acknowledging interruption and possible unfinished work. Persist ownership before a guarded removal, verify absence, retain history; duplicates never retry. Uncertainty is inspected through the launch inspect endpoint.","parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Recorded result; never task completion","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchInstance"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"requestId":{"type":"string","format":"uuid"},"digest":{"type":"string"},"confirmInspected":{"const":true},"confirmStop":{"const":true,"description":"Required only for a live preview; explicitly consents to stopping the running session."}},"required":["requestId","digest","confirmInspected"],"additionalProperties":false}}}}}
  /api/v1/launches/{id}/inspect:
    post: {"operationId":"inspectLaunch","description":"","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchInstance"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{},"required":[],"additionalProperties":false}}}},"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}]}
  /api/v1/launches/{id}/reconcile:
    post: {"operationId":"reconcileLaunch","description":"Explicit human acknowledgement of possible prior and background effects. No retry, adoption or cleanup.","responses":{"200":{"description":"Recorded result; never task readiness or acceptance","content":{"application/json":{"schema":{"$ref":"#/components/schemas/LaunchInstance"}}}},"409":{"description":"Changed, held or uncertain; inspect before proceeding","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"requestId":{"type":"string","format":"uuid"},"confirmInspected":{"const":true},"note":{"type":"string"}},"required":["requestId","confirmInspected","note"],"additionalProperties":false}}}},"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}]}
  /api/v1/terminals/socket:
    get: {"operationId":"terminalSocket","description":"Exact WebSocket upgrade path; rejects query strings, missing/null/foreign Origin and foreign Host. Send single-use ticket in the first JSON frame within five seconds. No bearer or ticket URL. See docs/TERMINAL-PROTOCOL.md for frames, processed-credit and heartbeat contract. Next and the host share one runtime broker.","responses":{"101":{"description":"WebSocket upgrade; first-frame authentication still required"},"403":{"description":"Upgrade refused"}}}
  /api/v1/interactions:
    post: {"operationId":"sendTerminalInput","description":"Literal input to the exact current worker; delivery is not completion. Unknown transport is never replayed.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/InteractionInput"}}}},"responses":{"200":{"description":"Recorded decision or delivery","content":{"application/json":{"schema":{"$ref":"#/components/schemas/InteractionRecord"}}}},"409":{"description":"Stale, uncertain or unsafe state; inspect without retrying input","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApiError"}}}}}}
  /api/v1/checkpoints:
