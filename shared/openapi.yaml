    AgentId:
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$
      description: Lowercase slug derived from the registration label, e.g. codex or claude-code.
    AdapterMode:
      type: string
      enum:
      - mock
      - tmux
    AgentType:
      type: string
      enum:
      - codex
      - claude
      - other
      description: Which CLI the human says runs in the pane; suggested from the process name, confirmed at registration.
    DeliveryStatus:
      type: string
      enum:
      - recorded
      - sending
      - delivered
      - uncertain
      - rejected
    PaneIdentity:
      type: object
      properties:
        paneId:
          type: string
        panePid:
          type: string
        serverPid:
          type: string
        serverStarted:
          type: string
        socketPath:
          type: string
      required:
      - paneId
      - panePid
      - serverPid
      - serverStarted
      - socketPath
    SessionRegistration:
      type: object
      description: Exact instance binding or read-only proposal. Discovery can return unsaved proposals; Start and explicit name/membership edits validate and persist them.
      properties:
        registrationId:
          type: string
          format: uuid
        cwd:
          type: string
        worktree:
          oneOf:
          - $ref: '#/components/schemas/WorktreeIdentity'
          - type: 'null'
        id:
          $ref: '#/components/schemas/AgentId'
        label:
          type: string
        agentType:
          $ref: '#/components/schemas/AgentType'
        repository:
          type: string
          description: Real path of the worktree root. Sessions sharing it form one project and one reservation scope.
        expectedCommand:
          type: string
          description: Foreground process name observed at registration; a native CLI may report a version string. Never a
            shell or generic interpreter.
        identity:
          $ref: '#/components/schemas/PaneIdentity'
        relayPrompt:
          type: string
        registeredAt:
          type: string
          format: date-time
        cliPid:
          type:
          - string
          - 'null'
          description: Foreground CLI process id pinned at registration; absent on legacy registrations.
      required:
      - id
      - label
      - agentType
      - repository
      - expectedCommand
      - identity
      - relayPrompt
      - registeredAt
    PanePreview:
      type: object
      properties:
        paneId:
          type: string
        text:
          type: string
        capturedAt:
          type: string
          format: date-time
      required:
      - paneId
      - text
      - capturedAt
    RelayPair:
      type: object
      description: Two registered sessions that alternate reviews on one worktree. Grouping and validation only.
      properties:
        id:
          $ref: '#/components/schemas/AgentId'
        name:
          type: string
        repository:
          type: string
        sessions:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/AgentId'
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - repository
      - sessions
      - createdAt
    PairInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Human name; its slug becomes the pair id.
        sessions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AgentId'
      required:
      - name
      - sessions
      additionalProperties: false
    Reservation:
      type: object
      description: A worktree with a command in flight or an unacknowledged uncertain delivery.
      properties:
        repository:
          type: string
        activeCommandId:
          type: string
          format: uuid
      required:
      - repository
      - activeCommandId
    EventInput:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/AgentType'
        event:
          type: string
          enum: [session_started, turn_started, turn_complete, turn_interrupted, outcome]
          description: turn_interrupted requires exact Codex session/turn, pane, CLI PID and start evidence; it cannot report settled completion or an outcome. It pauses an owned assignment without accepting a handoff.
        commandId:
          type: string
          format: uuid
        sourceTurnId:
          type: string
          maxLength: 200
        identity:
          $ref: '#/components/schemas/PaneIdentity'
        backgroundState:
          enum: [clear, active, unknown]
        backgroundSummary:
          $ref: '#/components/schemas/BackgroundSummary'
        completionSequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Claude turn_complete only. Ordered Stop observation within the exact source turn; duplicates are idempotent, older observations cannot replace newer evidence.
        prompt:
          type: string
          maxLength: 2000
        settled:
          type: boolean
        outcome:
          enum: [no_incoming_handoff, strong_objection, accept_without_improvement, accept_and_improve]
        reason:
          type: string
          maxLength: 500
        paneId:
          type: string
          pattern: ^%\d+$
          description: $TMUX_PANE inside the pane.
        socketPath:
          type: string
          description: First field of $TMUX; matched when present.
        cwd:
          type: string
        sessionId:
          type: string
          maxLength: 200
          description: The CLI's own session or thread id, when its payload carries one.
        reporterPid:
          type: string
          pattern: ^\d{1,10}$
          description: Transient hook process id, excluded from process evidence.
        cliPid:
          type: string
          pattern: ^\d{1,10}$
          description: CLI foreground process captured at the native turn start.
        startedAt:
          type: string
          format: date-time
          description: Native start timestamp, retained unchanged by its completion for independent activity tracking.
      required:
      - source
      - event
      - paneId
      additionalProperties: false
    TurnEvent:
      type: object
      properties:
        prompt:
          type: [string, 'null']
        outcome:
          enum: [no_incoming_handoff, strong_objection, accept_without_improvement, accept_and_improve, null]
        reason:
          type: [string, 'null']
        outcomeState:
          enum: [reported, pending, none]
        agentId:
          oneOf:
          - $ref: '#/components/schemas/AgentId'
          - type: 'null'
          description: The registered session the event matched, or null for an unregistered pane.
        paneId:
          type: string
        source:
          $ref: '#/components/schemas/AgentType'
        sessionId:
          type:
          - string
          - 'null'
        commandId:
          type:
          - string
          - 'null'
          format: uuid
          description: The last command delivered to that session before the event, if any.
        receivedAt:
          type: string
          format: date-time
      required:
      - agentId
      - paneId
      - source
      - sessionId
      - commandId
      - receivedAt
      - prompt
      - outcome
      - reason
      - outcomeState
    AvailablePane:
      type: object
      description: One live pane on the configured tmux server, for the human to choose. Not a readiness or lifecycle signal.
      properties:
        identity:
          $ref: '#/components/schemas/PaneIdentity'
        command:
          type: string
        cwd:
          type: string
        dead:
          type: boolean
        inMode:
          type: boolean
        synchronized:
          type: boolean
        location:
          type: string
          description: Current session:window.pane; informational and may change.
        registeredAs:
          oneOf:
          - $ref: '#/components/schemas/AgentId'
          - type: 'null'
      required:
      - identity
      - command
      - cwd
      - dead
      - inMode
      - synchronized
      - location
      - registeredAs
    WorktreeIdentity:
      type: object
      description: Canonical Git worktree root, git directory and index path. Linked worktrees of one repository have distinct identities.
      properties:
        root:
          type: string
        gitDir:
          type: string
        indexPath:
          type: string
      required:
      - root
      - gitDir
      - indexPath
    WorkspaceAgent:
      type: object
      description: One live pane inside a discovered workspace. Read-only inventory, not a registration, lifecycle or readiness signal.
      properties:
        identity:
          $ref: '#/components/schemas/PaneIdentity'
        location:
          type: string
          description: Current session:window.pane; informational and may change.
        command:
          type: string
        kind:
          type: string
          enum:
          - codex
          - claude
          - other
          - shell
          description: How the foreground process was classified. Only codex and claude can be group members.
        eligible:
          type: boolean
          description: A known coding CLI in a safe pane. Shells, unidentified processes and dead, copy-mode or synchronized panes are not.
        observable:
          type: boolean
          description: A live known coding CLI can remain visible in its group while copy mode or synchronized input blocks automation. Identity and process checks still apply.
        reason:
          type:
          - string
          - 'null'
        label:
          type: string
          description: The saved label when registered; coding CLIs otherwise default to the tmux session name, with pane identity kept separate.
        session:
          $ref: '#/components/schemas/SessionRegistration'
          description: Read-only identity proposal for an observable pane; persisted only by an explicit name/membership edit or Start. Discovery never registers or dispatches.
        registeredAs:
          oneOf:
          - $ref: '#/components/schemas/AgentId'
          - type: 'null'
      required:
      - identity
      - location
      - command
      - kind
      - eligible
      - reason
      - label
      - registeredAs
    Workspace:
      type: object
      description: A canonical current working directory inside a Git worktree with the live panes found there on one tmux server.
      properties:
        cwd:
          type: string
        socketPath:
          type: string
        worktree:
          $ref: '#/components/schemas/WorktreeIdentity'
        branch:
          type:
          - string
          - 'null'
          description: The checked-out branch, or null on a detached HEAD.
        agents:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceAgent'
        group:
          description: All eligible pane IDs included by default. Users may exclude any member; saved selection and execution support are separate.
          oneOf:
          - type: array
            items:
              type: string
            minItems: 1
          - type: 'null'
        git:
          $ref: '#/components/schemas/WorkspaceGit'
        gitError:
          type: string
        sharesIndexWith:
          type: array
          items:
            type: string
          description: Other workspace directories that resolve to this worktree and index; they cannot run conflicting work.
      required:
      - cwd
      - socketPath
      - worktree
      - branch
      - agents
      - group
      - sharesIndexWith
    SkippedDirectory:
      type: object
      properties:
        cwd:
          type: string
        panes:
          type: integer
        reason:
          type: string
      required:
      - cwd
      - panes
      - reason
    WorkspaceDiscovery:
      type: object
      properties:
        projects:
          type: array
          description: Project-centered inventory. Optional for older clients; always returned by the project-aware server.
          items:
            $ref: '#/components/schemas/Project'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedDirectory'
          description: Directories with live panes that are not inside a Git worktree or could not be inspected.
        error:
          type:
          - string
          - 'null'
          description: Set when the pane listing itself failed, e.g. no tmux server.
        discoveredAt:
          type: string
          format: date-time
      required:
      - workspaces
      - skipped
      - error
      - discoveredAt
    Project:
      type: object
      required: [id, name, commonDir, directoryName, worktrees, error, creations]
      properties:
        id: { type: string, description: Host-local identity derived from the canonical Git common directory. }
        name: { type: string }
        commonDir: { type: string }
        directoryName: { type: string, description: Safe task-root namespace; same-named separate clones get disambiguated names. }
        worktrees:
          type: array
          items:
            $ref: '#/components/schemas/ProjectWorktree'
        error: { type: [string, 'null'] }
        creations:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeCreation'
        removals:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeRemoval'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeIntegration'
        discards:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeDiscard'
        finishes:
          type: array
          items:
            $ref: '#/components/schemas/TaskFinish'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeUpdate'
        renames:
          type: array
          items:
            $ref: '#/components/schemas/WorktreeRename'
        settings: {$ref: '#/components/schemas/RepositorySettings'}
        workspaces:
          type: array
          description: Recorded task workspaces, active, pending and retired.
          items:
            $ref: '#/components/schemas/ManagedWorkspace'
    ProjectWorktree:
      type: object
      required: [id, path, branch, head, main, identity, error]
      properties:
        id: { type: string, description: Independent of branch; derived from canonical worktree metadata and index. }
        path: { type: string }
        branch: { type: [string, 'null'] }
        head: { type: [string, 'null'] }
        main: { type: boolean }
        identity:
          oneOf:
          - $ref: '#/components/schemas/WorktreeIdentity'
          - type: 'null'
        error: { type: [string, 'null'], description: Missing or inaccessible worktrees stay visible but cannot be used as setup sources. }
    WorktreePreviewInput:
      type: object
      additionalProperties: false
      required: [projectId, sourceWorktreeId, branch]
      properties:
        projectId: { type: string }
        sourceWorktreeId: { type: string }
        branch: { type: string, maxLength: 150, pattern: '^[A-Za-z0-9][A-Za-z0-9/_.-]*$' }
    WorktreePreview:
      type: object
      required: [projectId, sourceWorktreeId, branch, requestId, source, sourceBranch, sourceHead, path]
      properties:
        projectId: { type: string }
        sourceWorktreeId: { type: string }
        branch: { type: string }
        requestId: { type: string, format: uuid }
        source:
          $ref: '#/components/schemas/WorktreeIdentity'
        sourceBranch: { type: [string, 'null'] }
        sourceHead: { type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$' }
        path: { type: string, description: Canonical proposed path under the host task-worktree root. }
    WorktreeCreateInput:
      allOf:
      - $ref: '#/components/schemas/WorktreePreview'
      - type: object
        required: [confirm]
        properties:
          confirm: { type: boolean, const: true }
      unevaluatedProperties: false
    WorktreeCreation:
      type: object
      required: [input, status, message, updatedAt]
      properties:
        input:
          $ref: '#/components/schemas/WorktreeCreateInput'
        status: { type: string, enum: [applying, ready, uncertain, failed] }
        message: { type: string }
        updatedAt: { type: string, format: date-time }
    WorktreeRemovalInput:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
    WorktreeRemovalPreview:
      type: object
      required: [projectId, worktreeId, requestId, worktree, branch, head, targetRef, targetHead, integratedBy, integratedCommit]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        requestId: {type: string, format: uuid}
        worktree: {$ref: '#/components/schemas/WorktreeIdentity'}
        branch: {type: string}
        head: {type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'}
        targetRef: {type: string}
        targetHead: {type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'}
        integratedBy: {type: string, enum: [ancestry, squash]}
        integratedCommit: {type: string, pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'}
    WorktreeRemoveInput:
      allOf:
      - $ref: '#/components/schemas/WorktreeRemovalPreview'
      - type: object
        required: [confirm]
        properties:
          confirm: {type: boolean, const: true}
      unevaluatedProperties: false
    WorktreeRemoval:
      type: object
      required: [input, status, message, updatedAt]
      properties:
        input: {$ref: '#/components/schemas/WorktreeRemoveInput'}
        status: {type: string, enum: [applying, removed, uncertain, failed]}
        message: {type: string}
        updatedAt: {type: string, format: date-time}
    WorktreeIntegrationInput:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        through: {type: string, pattern: '^[0-9a-fA-F]{7,64}$', description: Inclusive task-branch endpoint; omit for HEAD.}
        acknowledgeActivity: {type: boolean, const: true, description: The human accepts that agents or processes in either checkout may still be working; skips only the settled-agent evidence check.}
    WorktreeIntegrationPreview:
      type: object
      required: [projectId, worktreeId, requestId, worktree, branch, head, through, previousCommit, dirty, targetRef, targetHead, target, mergeBase, commitCount, commits, tree, message, commands, consent]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        requestId: {type: string, format: uuid}
        worktree: {$ref: '#/components/schemas/WorktreeIdentity', description: The task worktree; it is not modified.}
        branch: {type: string}
        head: {$ref: '#/components/schemas/GitSha', description: Current task HEAD pinned separately from the batch endpoint.}
        through: {$ref: '#/components/schemas/GitSha', description: Resolved inclusive endpoint of this batch.}
        previousCommit: {type: [string, 'null'], description: Previous verified squash on the target or null for the first batch.}
        dirty: {type: boolean, description: Uncommitted task-worktree changes exist and are not part of the squash.}
        targetRef: {type: string}
        targetHead: {$ref: '#/components/schemas/GitSha'}
        target: {$ref: '#/components/schemas/WorktreeIdentity', description: The clean checkout with the integration branch checked out, where the squash commit is made.}
        mergeBase: {$ref: '#/components/schemas/GitSha', description: Exclusive batch base; the previous integrated source endpoint or the initial merge base.}
        commitCount: {type: integer, minimum: 1}
        commits:
          type: array
          maxItems: 100
          description: Up to 100 of the commits being squashed, newest first.
          items:
            type: object
            additionalProperties: false
            required: [sha, subject]
            properties:
              sha: {$ref: '#/components/schemas/GitSha'}
              subject: {type: string}
        tree: {$ref: '#/components/schemas/GitSha', description: The conflict-free merged tree; the squash commit must have exactly this tree.}
        message: {type: string, description: Editable default commit message, generated within the confirmation budget (at most 8 KiB once JSON-encoded, subjects shortened and the list cut with a count of omitted commits).}
        commands: {type: array, maxItems: 4, items: {type: string}, description: The exact Git operations confirmation authorizes, for display.}
        acknowledgeActivity: {type: boolean, const: true, description: Present when the preview was requested with the activity acknowledgement; covered by consent.}
        consent: {type: string, pattern: '^[0-9a-f]{64}$', description: Server digest of every pinned field except requestId and message.}
    WorktreeIntegrateRequest:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId, requestId, consent, message, confirm]
      description: Compact confirmation; the server re-derives the preview and requires its consent digest to match.
      properties:
        projectId: {type: string, maxLength: 200}
        worktreeId: {type: string, maxLength: 200}
        through: {$ref: '#/components/schemas/GitSha', description: Repeat the preview endpoint; omit only for a full-HEAD preview.}
        acknowledgeActivity: {type: boolean, const: true, description: Repeat the preview's activity acknowledgement; its consent digest covers it.}
        requestId: {type: string, format: uuid}
        consent: {type: string, pattern: '^[0-9a-f]{64}$'}
        message: {type: string, description: Printable, newlines allowed, at most 8192 bytes once JSON-encoded (escapes count), so every accepted request stays within the 16 KiB body limit together with the bounded identifiers.}
        confirm: {type: boolean, const: true}
    WorktreeIntegrateInput:
      description: The durable consent record, the re-derived preview with the confirmed message.
      allOf:
      - $ref: '#/components/schemas/WorktreeIntegrationPreview'
      - type: object
        required: [confirm]
        properties:
          confirm: {type: boolean, const: true}
      unevaluatedProperties: false
    WorktreeIntegration:
      type: object
      required: [input, status, message, updatedAt, commit]
      properties:
        input: {$ref: '#/components/schemas/WorktreeIntegrateInput'}
        retired: {type: boolean, description: Historical result retained after removal or discard; no longer a batch checkpoint.}
        status: {type: string, enum: [applying, integrated, uncertain, failed]}
        message: {type: string}
        updatedAt: {type: string, format: date-time}
        commit: {type: [string, 'null'], description: The verified squash commit on the integration branch.}
    WorktreeUpdateMode:
      type: string
      enum: [update, rebase, reset]
      description: 'update: replay only the commits after the proven integrated boundary; rebase: replay every commit since the merge base; reset: drop the branch''s commits and uncommitted tracked changes. Absent means update.'
    WorktreeUpdateInput:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        mode: {$ref: '#/components/schemas/WorktreeUpdateMode'}
    WorktreeUpdatePreview:
      type: object
      required: [projectId, worktreeId, mode, requestId, worktree, branch, head, targetRef, targetHead, boundaryBy, boundary, replay, tree, fastForward, equivalent, commands, lost, consent]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        mode: {$ref: '#/components/schemas/WorktreeUpdateMode'}
        requestId: {type: string, format: uuid}
        worktree: {$ref: '#/components/schemas/WorktreeIdentity'}
        branch: {type: string}
        head: {$ref: '#/components/schemas/GitSha', description: The current task tip, kept under the recovery ref when the update is confirmed.}
        targetRef: {type: string}
        targetHead: {$ref: '#/components/schemas/GitSha'}
        boundaryBy: {type: string, enum: [ancestry, squash, base, reset], description: 'ancestry: the target contains the task tip; squash: squash evidence or a checkpoint proves the content through the boundary; base: every commit after the merge base is replayed; reset: nothing is replayed, the target replaces the branch.'}
        boundary: {$ref: '#/components/schemas/GitSha', description: Last task commit whose content the target already contains; equals head when fully integrated and the target head for a reset.}
        replay:
          type: array
          maxItems: 100
          description: Commits after the boundary, oldest first, each with the tree it produces on the target; empty for a fully integrated branch.
          items:
            type: object
            additionalProperties: false
            required: [sha, subject, tree]
            properties:
              sha: {$ref: '#/components/schemas/GitSha'}
              subject: {type: string}
              tree: {$ref: '#/components/schemas/GitSha'}
        tree: {$ref: '#/components/schemas/GitSha', description: Tree of the new branch tip.}
        fastForward: {type: boolean, description: The old tip is an ancestor of the new one, so no history is rewritten.}
        equivalent: {type: string, description: 'The familiar Git command this is equivalent to, for orientation (for example git rebase main); commands is what actually runs.'}
        commands: {type: array, maxItems: 4, items: {type: string}, description: The exact Git operations confirmation authorizes, for display.}
        lost:
          description: Reset only; null otherwise.
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [commits, recent, changes, paths, fingerprint]
            properties:
              commits: {type: integer, minimum: 0, description: Commits that leave the branch; they stay reachable under the recovery ref.}
              recent:
                type: array
                maxItems: 20
                description: The newest of those commits.
                items:
                  type: object
                  additionalProperties: false
                  required: [sha, subject]
                  properties:
                    sha: {$ref: '#/components/schemas/GitSha'}
                    subject: {type: string}
              changes: {type: integer, minimum: 0, description: Uncommitted tracked changes (staged and unstaged) that are discarded for good.}
              paths: {type: array, maxItems: 20, items: {type: string}}
              fingerprint: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of HEAD, index entries, unstaged content and untracked file contents; consent binds to this exact content.}
        consent: {type: string, pattern: '^[0-9a-f]{64}$', description: Server digest of every pinned field except requestId.}
    WorktreeUpdateRequest:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId, requestId, consent, confirm]
      description: Compact confirmation; the server re-derives the preview and requires its consent digest to match.
      properties:
        projectId: {type: string, maxLength: 200}
        worktreeId: {type: string, maxLength: 200}
        mode: {$ref: '#/components/schemas/WorktreeUpdateMode'}
        requestId: {type: string, format: uuid}
        consent: {type: string, pattern: '^[0-9a-f]{64}$'}
        confirmBranch: {type: string, maxLength: 200, description: Optional compatibility field for older clients; if supplied it must equal the previewed branch exactly.}
        confirm: {type: boolean, const: true}
    WorktreeUpdateConfirm:
      description: The durable consent record, the re-derived preview with the create-only recovery ref.
      allOf:
      - $ref: '#/components/schemas/WorktreeUpdatePreview'
      - type: object
        required: [recoveryRef, confirm]
        properties:
          recoveryRef: {type: string, pattern: '^refs/altcli/preserved/', description: refs/altcli/preserved/<requestId>, created at the old tip before the branch moves and never deleted by the app.}
          confirm: {type: boolean, const: true}
      unevaluatedProperties: false
    WorktreeUpdate:
      type: object
      required: [input, status, message, updatedAt, commit]
      properties:
        input: {$ref: '#/components/schemas/WorktreeUpdateConfirm'}
        status: {type: string, enum: [applying, updated, uncertain, failed]}
        message: {type: string}
        updatedAt: {type: string, format: date-time}
        commit: {type: [string, 'null'], description: The new branch tip, recorded before the branch moves (the target head or the last replayed commit).}
    WorktreeRenameInput:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId, newBranch]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        newBranch: {type: string, maxLength: 150, pattern: '^[A-Za-z0-9][A-Za-z0-9/_.-]*$'}
    WorktreeRenamePreview:
      type: object
      required: [projectId, worktreeId, newBranch, requestId, worktree, branch, head, fingerprint, dirty, checkpoints, commands]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        newBranch: {type: string}
        requestId: {type: string, format: uuid}
        worktree: {$ref: '#/components/schemas/WorktreeIdentity'}
        branch: {type: string, description: The current branch name.}
        head: {$ref: '#/components/schemas/GitSha'}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of HEAD, index entries, unstaged content and untracked file contents; uncommitted work is carried unchanged.}
        dirty: {type: boolean}
        checkpoints: {type: integer, minimum: 0, description: Recorded squash batches whose boundary carries over to the new name.}
        commands: {type: array, maxItems: 10, items: {type: string}, description: 'The Git rename, then tmux rename-session for each open app-launched session in the worktree not already named for the new branch; confirmation authorizes exactly these.'}
    WorktreeRenameConfirm:
      allOf:
      - $ref: '#/components/schemas/WorktreeRenamePreview'
      - type: object
        required: [confirm]
        properties:
          confirm: {type: boolean, const: true}
      unevaluatedProperties: false
    WorktreeRename:
      type: object
      required: [input, status, message, updatedAt]
      properties:
        input: {$ref: '#/components/schemas/WorktreeRenameConfirm'}
        status: {type: string, enum: [applying, renamed, uncertain, failed]}
        message: {type: string}
        updatedAt: {type: string, format: date-time}
    WorktreeDiscardInput:
      type: object
      additionalProperties: false
      required: [projectId, worktreeId]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
    WorktreeDiscardPreview:
      type: object
      required: [projectId, worktreeId, requestId, worktree, branch, head, targetRef, targetHead, dirty, changeCount, fingerprint, unmergedCommits]
      properties:
        projectId: {type: string}
        worktreeId: {type: string}
        requestId: {type: string, format: uuid}
        worktree: {$ref: '#/components/schemas/WorktreeIdentity'}
        branch: {type: string}
        head: {$ref: '#/components/schemas/GitSha'}
        targetRef: {type: string}
        targetHead: {$ref: '#/components/schemas/GitSha'}
        dirty: {type: boolean}
        changeCount: {type: integer, minimum: 0, description: Modified or nonignored untracked files that would be lost.}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of HEAD, index entries, unstaged content and untracked file contents; consent binds to this exact content.}
        unmergedCommits: {type: integer, minimum: 0, description: Commits the integration branch does not contain; unreachable once the branch is deleted.}
    WorktreeDiscardConfirm:
      allOf:
      - $ref: '#/components/schemas/WorktreeDiscardPreview'
      - type: object
        required: [confirmBranch, confirm]
        properties:
          confirmBranch: {type: string, description: Must equal branch exactly.}
          confirm: {type: boolean, const: true}
      unevaluatedProperties: false
    WorktreeDiscard:
      type: object
      required: [input, status, message, updatedAt]
      properties:
        input: {$ref: '#/components/schemas/WorktreeDiscardConfirm'}
        status: {type: string, enum: [applying, discarded, uncertain, failed]}
        message: {type: string}
        updatedAt: {type: string, format: date-time}
        branchRemains: {type: boolean, description: Set by inspection when the directory and worktree entry are gone and the branch is at the confirmed head; a confirmed finish may delete it.}
    ActivityReset:
      type: object
      required: [agentId, registrationId, expectedUpdatedAt, confirmReady]
      additionalProperties: false
      properties:
        agentId: {type: string}
        registrationId: {type: string, format: uuid}
        expectedUpdatedAt: {type: [string, 'null'], format: date-time}
        confirmReady: {const: true}
    WorkspaceReset:
      type: object
      properties:
        repository:
          type: string
          description: Absolute canonical worktree root, as shown on the workspace card.
        confirmReady:
          type: boolean
          const: true
      required:
      - repository
      - confirmReady
    WorkspaceResetResult:
      type: object
      properties:
        groups:
          type: array
          items:
            type: string
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AgentId'
        pairs:
          type: array
          items:
            type: string
      required:
      - sessions
      - pairs
      - groups
    RenameSession:
      type: object
      properties:
        label: {type: string, minLength: 1, maxLength: 40}
        expectedLabel: {type: string, minLength: 1, maxLength: 40}
        expectedRegistrationId: {type: string, format: uuid}
      required: [label, expectedLabel, expectedRegistrationId]
      additionalProperties: false
    RegistrationInput:
      type: object
      properties:
        paneId:
          type: string
          pattern: ^%\d+$
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: Human label; its slug becomes the agent id.
        agentType:
          $ref: '#/components/schemas/AgentType'
        repository:
          type: string
          description: Absolute path; defaults to the pane's current directory.
        relayPrompt:
          type: string
          minLength: 1
          maxLength: 2000
          description: Single-line prompt sent by Relay; defaults to "relay".
      required:
      - paneId
      - label
      additionalProperties: false
    RegistrationResult:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/SessionRegistration'
        replaced:
          type: boolean
          description: True when an existing registration with the same id was re-pointed at this pane.
      required:
      - session
      - replaced
    RemoveResult:
      type: object
      properties:
        removed:
          type: boolean
          const: true
      required:
      - removed
    Snapshot:
      type: object
      properties:
        agentId:
          $ref: '#/components/schemas/AgentId'
        text:
          type: string
        capturedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - available
          - unavailable
        error:
          type: string
      required:
      - agentId
      - text
      - capturedAt
      - status
      description: A replaceable bounded screen capture, not a transcript or lifecycle/completion event.
    CommandRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        agentId:
          $ref: '#/components/schemas/AgentId'
        kind:
          type: string
          enum:
          - relay
          - instruction
        text:
          type: string
        handoff:
          type: boolean
          description: Whether finishing this command hands off to the relay partner. Always true for a relay.
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
        releasedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - agentId
      - kind
      - text
      - handoff
      - status
      - createdAt
      - updatedAt
      - error
      - releasedAt
    HistoryCommand:
      allOf:
      - $ref: '#/components/schemas/CommandRecord'
      - type: object
        properties:
          runId:
            type:
            - string
            - 'null'
            description: The server run this command belonged to, from the durable ledger; null when it predates the ledger.
          pairId:
            type:
            - string
            - 'null'
            description: The pair frozen into that run, for history filtering; null for a single-agent turn.
          groupId:
            type: [string, 'null']
            description: Implementation group identity, or the preserved legacy pair identity.
          repository:
            type: [string, 'null']
            description: The worktree root the command's run executed in, so the console shows one checkout's history; null when it predates the ledger.
        required:
        - runId
        - pairId
        - groupId
        - repository
    ConsoleState:
      type: object
      properties:
        manualSessions: {type: array, items: {$ref: "#/components/schemas/ManualSession"}}
        interactions: {"type":"array","items":{"$ref":"#/components/schemas/InteractionRecord"}}
        checkpoints: {"type":"array","items":{"$ref":"#/components/schemas/InputCheckpoint"}}
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        legacyEnabled:
          type: boolean
          description: Whether new Stage relay runs may start (ALTCLI_ENABLE_LEGACY_RELAY; absent means true). Existing runs retain their protocol.
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RelayRun'
        executions:
          type: array
          items:
            $ref: '#/components/schemas/Execution'
        mode:
          $ref: '#/components/schemas/AdapterMode'
        inputEnabled:
          type: boolean
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionRegistration'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/InstanceState'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/AgentActivity'
        pairs:
          type: array
          items:
            $ref: '#/components/schemas/RelayPair'
        panes:
          type: array
          items:
            $ref: '#/components/schemas/AvailablePane'
        panesError:
          type:
          - string
          - 'null'
          description: Set when the pane listing itself failed, e.g. no tmux server; sessions may still be listed.
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/HistoryCommand'
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
        turns:
          type: array
          items:
            $ref: '#/components/schemas/TurnEvent'
          description: Latest turn-complete event per registered session, plus the latest unmatched one.
        serverTime:
          type: string
          format: date-time
      required:
      - mode
      - inputEnabled
      - sessions
      - instances
      - panes
      - panesError
      - pairs
      - snapshots
      - commands
      - reservations
      - turns
      - serverTime
      - groups
      - legacyEnabled
      - runs
      - executions
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    ReleaseInput:
      type: object
      properties:
        expectedCommandId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
        confirmReady:
          const: true
          type: boolean
      required:
      - expectedCommandId
      - confirmReady
    ReleaseResult:
      type: object
      properties:
        released:
          type: boolean
          const: true
      required:
      - released
    CommandInput:
      oneOf:
      - type: object
        properties:
          requestId:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          agentId:
            $ref: '#/components/schemas/AgentId'
          confirmReady:
            type: boolean
            const: true
          kind:
            const: relay
            type: string
          pairId:
            $ref: '#/components/schemas/AgentId'
          stage:
            $ref: '#/components/schemas/StageBinding'
          autoContinue:
            type: boolean
          turnLimit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          text:
            type: string
            minLength: 1
            maxLength: 2000
            description: 'Optional context; the controller sends "<registered relay prompt>: <text>". Line breaks are allowed.'
        required:
        - requestId
        - agentId
        - confirmReady
        - kind
        additionalProperties: false
      - type: object
        properties:
          requestId:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          agentId:
            $ref: '#/components/schemas/AgentId'
          confirmReady:
            type: boolean
            const: true
          kind:
            const: instruction
            type: string
          pairId:
            $ref: '#/components/schemas/AgentId'
          stage:
            $ref: '#/components/schemas/StageBinding'
          autoContinue:
            type: boolean
          turnLimit:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
          text:
            type: string
            minLength: 1
            maxLength: 2000
            description: Nonblank input of one or more lines; maximum 2,000 UTF-8 bytes. CRLF is normalized to LF;
              other controls, DEL/C1 and Unicode line separators are rejected. Multi-line text reaches the terminal
              as one bracketed paste. The byte limit is stricter than maxLength for multibyte text.
          handoff:
            type: boolean
            description: When true, finishing this instruction hands off to the relay partner as an accepted-and-improved
              turn would; its result is the next thing to review. Default false.
        required:
        - requestId
        - agentId
        - confirmReady
        - kind
        - text
        additionalProperties: false
      description: A unique client UUID v4 is required. Same ID and payload returns the stored result without redelivery.
        Reuse with a different payload conflicts. Never retry automatically after an uncertain response.
    StageBinding:
      type: object
      description: The branch and full commit a Stage relay start was confirmed on. Required for a new start; the run is bound to it.
      properties:
        branch: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9/_.-]{0,150}$'}
        head: {$ref: '#/components/schemas/GitSha'}
      required: [branch, head]
      additionalProperties: false
    GitSha:
      type: "string"
      pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
    GitChange:
      type: object
      properties:
        status: {type: string, minLength: 2, maxLength: 2, description: 'Git porcelain columns: index then worktree; ?? means untracked.'}
        path: {type: string, description: Path relative to the worktree root.}
        originalPath: {type: [string, "null"], description: Rename or copy source path.}
      required: [status, path, originalPath]
      additionalProperties: false
    BranchState:
      type: "object"
      properties:
        branch: {"type":["string","null"]}
        head: {"$ref":"#/components/schemas/GitSha"}
        primary: {"type":["string","null"]}
        clean: {"type":"boolean"}
        changes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/GitChange'}}
        changeCount: {type: integer, minimum: 0, description: Total changed paths before truncating the displayed list to 100.}
      required: ["branch","head","primary","clean","changes","changeCount"]
      additionalProperties: false
    WorkspaceGit:
      description: The workspace branch reading plus the host's integration-branch policy. The default branch (origin/HEAD), main and ALTCLI_INTEGRATION_BRANCHES are starting points, never implementation branches.
      type: object
      properties:
        branch: {type: [string, 'null']}
        head: {$ref: '#/components/schemas/GitSha'}
        primary: {type: [string, 'null']}
        clean: {type: boolean}
        changes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/GitChange'}}
        changeCount: {type: integer, minimum: 0, description: Total changed paths before truncating the displayed list to 100.}
        integration: {type: boolean, description: The checked-out branch is an integration branch. Implementation must create a task branch or task worktree from it.}
        taskBase:
          oneOf: [{$ref: '#/components/schemas/GitSha'}, {type: 'null'}]
          description: Where task work on this branch begins. The head when no commit lies beyond an integration tip, the single nearest merge base when known, null when the user must confirm it or the branch is an integration branch.
        stageRelay:
          type: object
          description: Whether the checked-out branch runs Stage relay; only local main or the recorded default branch does.
          properties:
            eligible: {type: boolean}
            reason: {type: [string, 'null'], description: Why Stage relay is unavailable on this branch; null when eligible.}
          required: [eligible, reason]
          additionalProperties: false
      required: [branch, head, primary, clean, changes, changeCount, integration, taskBase, stageRelay]
      additionalProperties: false
    BranchConsent:
      description: Staying on an existing task branch keeps its permanent task baseline; a new branch begins at head. An integration branch is refused as the implementation branch, and taskBase cannot accompany newBranch.
      type: "object"
      properties:
        branch: {"type":["string","null"]}
        head: {"$ref":"#/components/schemas/GitSha"}
        newBranch: {"type":"string","pattern":"^[A-Za-z0-9][A-Za-z0-9/_.-]{0,150}$"}
        taskBase: {"$ref":"#/components/schemas/GitSha","description":"Confirmed task baseline, an ancestor of head. When absent on an existing branch, the server infers it from integration tips or refuses ambiguous history. A new branch always begins at head."}
      required: ["branch","head"]
      additionalProperties: false
    Group:
      type: "object"
      properties:
        id: {"$ref":"#/components/schemas/AgentId"}
        name: {"type":"string"}
        repository: {"type":"string"}
        cwd: {"type":["string","null"]}
        members: {"type":"array","items":{"$ref":"#/components/schemas/AgentId"},"minItems":0,"uniqueItems":true, "description":"Selected eligible instances, including larger groups. Empty selection disables Start. Plan and Implementation execution currently require one or two members."}
        revision: {"type":"integer"}
        createdAt: {"type":"string","format":"date-time"}
        legacyPairId: {"type":["string","null"]}
      required: ["id","name","repository","cwd","members","revision","createdAt","legacyPairId"]
      additionalProperties: false
    GroupSelection:
      type: object
      properties:
        members: {type: array, minItems: 0, uniqueItems: true, items: {$ref: '#/components/schemas/AgentId'}}
        expectedRevision: {type: integer, minimum: 1}
        registrations: {type: object, additionalProperties: {type: string, format: uuid}}
      required: [members, expectedRevision, registrations]
      additionalProperties: false
    GroupInput:
      type: "object"
      properties:
        name: {"type":"string","minLength":1,"maxLength":40}
        members: {"type":"array","items":{"$ref":"#/components/schemas/AgentId"},"minItems":1,"uniqueItems":true}
      required: ["name","members"]
      additionalProperties: false
    StandaloneStart:
      type: object
      description: Plain Send; no commit or branch authorization is implied.
      properties:
        keyboardSettlement: {"$ref":"#/components/schemas/KeyboardSettlement"}
        groupRevision: {"type":"integer","minimum":1}
        registrations: {"type":"object","minProperties":1,"maxProperties":2,"additionalProperties":{"type":"string","format":"uuid"}}
        requestId: {"type":"string","format":"uuid"}
        groupId: {"$ref":"#/components/schemas/AgentId"}
        agentId: {"$ref":"#/components/schemas/AgentId"}
        text: {"type":"string","maxLength":2000}
        policy: {"enum":["solo","peer","worker_reviewer"]}
        workerId: {"$ref":"#/components/schemas/AgentId"}
        attachments: {"$ref":"#/components/schemas/AttachmentIds","description":"With images, the wire prompt names only an immutable input manifest holding the instruction and image descriptors."}
        confirmReady: {"const":true}
      required: [requestId, groupId, groupRevision, registrations, agentId, text, policy, confirmReady]
      additionalProperties: false
    ReviewPreviewInput:
      type: object
      properties:
        groupId: {$ref: '#/components/schemas/AgentId'}
        head: {$ref: '#/components/schemas/GitSha'}
        logPath: {type: string, maxLength: 200, description: 'Tracked journal mirror to exclude from project content, when the project keeps one.'}
        base: {$ref: '#/components/schemas/GitSha', description: 'Excluded ancestor. Omit to derive it from recipient and taskBase, which are then required.'}
        recipient: {$ref: '#/components/schemas/AgentId', description: 'Group member who will review; the baseline is the newest first-parent commit at which the journal records a completed turn of theirs.'}
        taskBase: {$ref: '#/components/schemas/GitSha', description: 'Fallback baseline when the recipient has no journal entry on this chain.'}
        commitPending: {type: boolean, default: false, description: 'Preview the committed portion before a pending snapshot; permits HEAD and empty committed ranges.'}
      required: [groupId, head]
      additionalProperties: false
    ReviewPreview:
      type: object
      properties:
        base: {$ref: '#/components/schemas/GitSha'}
        baseSubject: {type: string, description: 'Subject of the baseline commit.'}
        head: {$ref: '#/components/schemas/GitSha'}
        since: {enum: [explicit, recipient, task], description: 'Origin of the baseline.'}
        commits:
          type: array
          maxItems: 100
          description: Every commit in base..head, newest first.
          items:
            type: object
            properties:
              sha: {$ref: '#/components/schemas/GitSha'}
              subject: {type: string}
            required: [sha, subject]
            additionalProperties: false
        candidates:
          type: array
          maxItems: 101
          description: Baselines a human may choose, earliest first — base, then HEAD's first-parent ancestors after it through HEAD's parent, or HEAD when commitPending is true.
          items:
            type: object
            properties:
              sha: {$ref: '#/components/schemas/GitSha'}
              subject: {type: string}
            required: [sha, subject]
            additionalProperties: false
      required: [base, baseSubject, head, since, commits, candidates]
      additionalProperties: false
    ImplementationStart:
      type: "object"
      properties:
        keyboardSettlement: {"$ref":"#/components/schemas/KeyboardSettlement"}
        groupRevision: {"type":"integer","minimum":1}
        registrations: {"type":"object","minProperties":1,"maxProperties":2,"additionalProperties":{"type":"string","format":"uuid"}}
        requestId: {"type":"string","format":"uuid"}
        groupId: {"$ref":"#/components/schemas/AgentId"}
        agentId: {"$ref":"#/components/schemas/AgentId"}
        kind: {"enum":["work","commit","review"],"description":"commit snapshots all current changes without implementing pending requests; optional text is handoff context. With handoff=true, two participants review from reviewBase through the new snapshot after validated publication. Without handoff, autoContinue must be false; solo commits never relay. reviewBase is required for review and optional for commit with handoff (defaults to the pre-snapshot HEAD)."}
        text: {"type":"string","maxLength":2000}
        handoff: {"type":"boolean"}
        policy: {"enum":["solo","peer","worker_reviewer"]}
        workerId: {"$ref":"#/components/schemas/AgentId"}
        autoContinue: {"type":"boolean"}
        turnLimit: {"type":"integer","minimum":1,"maximum":200}
        pauseOnObjection: {"type":"boolean","description":"Agreement: a reviewer objection pauses for the human instead of routing to the author. Default false."}
        logPath: {"type":"string","maxLength":200,"description":"Explicit project preference: also mirror every journal entry into this tracked, nonignored JSON-lines file inside the handoff commit, so report-only turns commit too. Absent (default), the journal lives only in AltCLI and report-only turns publish no commit."}
        branch: {"$ref":"#/components/schemas/BranchConsent"}
        reviewBase: {"$ref":"#/components/schemas/GitSha"}
        reviewNote: {type: string, maxLength: 1900, description: A note from the human for the peer that reviews this handoff, delivered with the review assignment as its note. Requires handoff and is not accepted for kind review, whose text is the review context.}
        attachments: {"$ref":"#/components/schemas/AttachmentIds","description":"kind work only. Frozen and pinned at admission; every assignment of the run, including reviews, carries the descriptors."}
        confirmReady: {"const":true}
      required: ["requestId","groupId","groupRevision","registrations","agentId","kind","handoff","policy","autoContinue","turnLimit","branch","confirmReady"]
      additionalProperties: false
    PolicyChange:
      type: "object"
      properties:
        runId: {"type":"string","format":"uuid"}
        expectedCommandId: {"type":"string","format":"uuid"}
        expectedRevision: {"type":"integer","minimum":1}
        policy: {"enum":["peer","worker_reviewer"]}
        workerId: {"$ref":"#/components/schemas/AgentId"}
        autoContinue: {"type":"boolean"}
        pauseOnObjection: {"type":"boolean","description":"Omitted keeps the run's current objection agreement."}
      required: ["runId","expectedCommandId","expectedRevision","policy","autoContinue"]
      additionalProperties: false
    HandoffIdentity:
      type: "object"
      properties:
        schema: {"const":1}
        runId: {"type":"string","format":"uuid"}
        commandId: {"type":"string","format":"uuid"}
        turn: {"type":"integer"}
        policyRevision: {"type":"integer"}
        phase: {"const":"implementation"}
        action: {"enum":["work","review","review_and_improve"]}
        agentId: {"$ref":"#/components/schemas/AgentId"}
        registrationId: {"type":"string","format":"uuid"}
        parent: {"$ref":"#/components/schemas/GitSha"}
        base: {"$ref":"#/components/schemas/GitSha"}
        reviewBase: {"type":["string","null"]}
        reviewHead: {"type":["string","null"]}
      required: ["schema","runId","commandId","turn","policyRevision","phase","action","agentId","registrationId","parent","base","reviewBase","reviewHead"]
      additionalProperties: false
    HandoffEntry:
      type: "object"
      properties:
        schema: {"const":1}
        runId: {"type":"string","format":"uuid"}
        commandId: {"type":"string","format":"uuid"}
        turn: {"type":"integer"}
        policyRevision: {"type":"integer"}
        phase: {"const":"implementation"}
        action: {"enum":["work","review","review_and_improve"]}
        agentId: {"$ref":"#/components/schemas/AgentId"}
        registrationId: {"type":"string","format":"uuid"}
        parent: {"$ref":"#/components/schemas/GitSha"}
        base: {"$ref":"#/components/schemas/GitSha"}
        reviewBase: {"type":["string","null"]}
        reviewHead: {"type":["string","null"]}
        model: {"type":"string","maxLength":200}
        decision: {"enum":["accept","object",null]}
        reason: {"type":["string","null"],"maxLength":16000}
        needsHuman: {"type":"boolean"}
        summary: {"type":"string","minLength":1,"maxLength":16000}
        checks: {"type":"array","items":{"type":"string","maxLength":2000},"maxItems":100}
      required: ["schema","runId","commandId","turn","policyRevision","phase","action","agentId","registrationId","parent","base","reviewBase","reviewHead","model","decision","reason","needsHuman","summary","checks"]
      additionalProperties: false
    Publication:
      type: "object"
      description: HEAD after the validated turn — the handoff commit, or the unchanged parent when a report-only turn published no commit — with the published result.
      properties:
        sha: {"$ref":"#/components/schemas/GitSha"}
        projectChanged: {"type":"boolean"}
        entry: {"$ref":"#/components/schemas/HandoffEntry"}
      required: ["sha","projectChanged","entry"]
      additionalProperties: false
    HandoffArchive:
      type: object
      description: The handoff commit's content kept in the journal so squash integration and branch deletion do not lose intermediate revisions. A complete archive is a git-apply-able patch including binary data; complete=false means only a diffstat was kept because the patch exceeded the size bound or contained text that cannot be stored as UTF-8.
      properties:
        patch: {type: string}
        complete: {type: boolean}
      required: [patch, complete]
      additionalProperties: false
    JournalRecord:
      type: object
      description: One completed implementation turn in AltCLI's durable history, independent of the checkout and its branch.
      properties:
        runId: {type: string, format: uuid}
        commandId: {type: string, format: uuid}
        repository: {type: string, description: Worktree root the run executed in.}
        branch: {type: string}
        agentId: {$ref: '#/components/schemas/AgentId'}
        turn: {type: integer}
        action: {enum: [work, review, review_and_improve]}
        parent: {$ref: '#/components/schemas/GitSha'}
        sha: {$ref: '#/components/schemas/GitSha'}
        projectChanged: {type: boolean}
        entry: {$ref: '#/components/schemas/HandoffEntry'}
        archive: {oneOf: [{$ref: '#/components/schemas/HandoffArchive'}, {type: 'null'}], description: Null until archived; a report-only turn has nothing to archive.}
        recordedAt: {type: string, format: date-time}
      required: [runId, commandId, repository, branch, agentId, turn, action, parent, sha, projectChanged, entry, archive, recordedAt]
      additionalProperties: false
    HostConfig:
      type: object
      description: The host's effective global configuration as read at startup. Read-only; the access token is never included.
      properties:
        mode: {$ref: '#/components/schemas/AdapterMode'}
        terminalEnabled: {type: boolean}
        launchEnabled: {type: boolean}
        inputEnabled: {type: boolean}
        legacyEnabled: {type: boolean, description: 'Whether Stage relay may start on main or the default branch (ALTCLI_ENABLE_LEGACY_RELAY; absent means true).'}
        dataDir: {type: string, description: Controller data (SQLite store, journal, plans, assignments); the adapter mode is appended to the configured base.}
        worktreeDir: {type: string, description: Where task worktrees are created by default.}
        tmuxBin: {type: string}
        tmuxPath: {type: [string, 'null'], description: Where PATH resolves tmuxBin, or the configured absolute path when it exists; null when no executable was found.}
        tmuxSocket: {type: [string, 'null']}
        integrationBranches: {type: array, items: {type: string}, description: Creation bases, never implementation branches; each project's detected default branch is always added.}
        allowedOrigins: {type: array, items: {type: string}}
        claudeConfigDir: {type: string}
        codexHome: {type: string}
        homeDir: {type: string, description: The host user's home directory; the console shows paths under it with a leading ~.}
        environment: {type: array, items: {type: string}, description: The environment variables that were set when the host started; a setting not listed uses its default.}
      required: [mode, inputEnabled, legacyEnabled, dataDir, worktreeDir, tmuxBin, tmuxPath, tmuxSocket, integrationBranches, allowedOrigins, claudeConfigDir, codexHome, homeDir, environment]
    HistoryExport:
      type: object
      properties:
        interactions: {"type":"array","items":{"$ref":"#/components/schemas/InteractionRecord"}}
        schema: {const: 1}
        exportedAt: {type: string, format: date-time}
        repository: {type: [string, 'null'], description: The worktree root the export was limited to, or null for everything.}
        runs: {type: array, items: {$ref: '#/components/schemas/RelayRun'}}
        turns: {type: array, items: {$ref: '#/components/schemas/Execution'}}
        journal: {type: array, items: {$ref: '#/components/schemas/JournalRecord'}}
      required: [schema, exportedAt, repository, runs, turns, journal]
      additionalProperties: false
    ImplementationTurn:
      type: "object"
      properties:
        identity: {"$ref":"#/components/schemas/HandoffIdentity"}
        resultPath: {"type":"string","description":"External result file the agent writes before finishing; never inside the checkout."}
        published: {"$ref":"#/components/schemas/Publication"}
      required: ["identity","resultPath"]
      additionalProperties: false
    ImplementationRun:
      type: "object"
      properties:
        phase: {"const":"implementation"}
        handoff: {"const":"commit"}
        group: {"$ref":"#/components/schemas/Group"}
        cwd: {"type":"string"}
        worktree: {"$ref":"#/components/schemas/WorktreeIdentity"}
        branch: {"type":"string"}
        consent: {"$ref":"#/components/schemas/BranchConsent"}
        setup: {"enum":["pending","applying","ready","uncertain"]}
        logPath: {"type":["string","null"],"description":"Null keeps the journal in AltCLI only."}
        taskBaseSha: {"$ref":"#/components/schemas/GitSha"}
        acceptedSha: {"$ref":"#/components/schemas/GitSha"}
        candidateSha: {"type":["string","null"]}
        candidateAuthor: {"type":["string","null"]}
        expectedParentSha: {"$ref":"#/components/schemas/GitSha"}
        turn: {"type":"integer"}
        findings: {"type":["string","null"]}
        latestPublication: {"oneOf":[{"$ref":"#/components/schemas/Publication"},{"type":"null"}]}
        next: {"oneOf":[{"type":"null"},{"type":"object","properties":{"agentId":{"type":"string"},"action":{"enum":["work","review","review_and_improve"]},"text":{"type":"string"},"handoff":{"type":"boolean"}},"required":["agentId","action","text","handoff"],"additionalProperties":false}]}
        request: {"$ref":"#/components/schemas/ImplementationStart"}
        initialWorktreeFingerprint: {"type":"string","pattern":"^[0-9a-f]{64}$","description":"Captured unfinished work for the first work turn only; absent for clean starts."}
        policy: {"enum":["solo","peer","worker_reviewer"]}
        workerId: {"type":["string","null"]}
        revision: {"type":"integer"}
      required: ["phase","handoff","group","cwd","worktree","branch","consent","setup","logPath","taskBaseSha","acceptedSha","candidateSha","candidateAuthor","expectedParentSha","turn","findings","latestPublication","next","request","policy","workerId","revision"]
      additionalProperties: false
    BackgroundSummary:
      type: object
      properties:
        tasks: {"type":["integer","null"],"minimum":0,"maximum":100000}
        crons: {"type":["integer","null"],"minimum":0,"maximum":100000}
        taskTypes: {"type":"array","maxItems":5,"uniqueItems":true,"items":{"enum":["local_bash","local_agent","remote_agent","in_process_teammate","unknown"]}}
      required: [tasks, crons, taskTypes]
      additionalProperties: false
    BlockedHandoff:
      type: object
      properties:
        commandId: {"type":"string","format":"uuid"}
        revision: {"type":"string","format":"uuid"}
        backgroundState: {"enum":["clear","active","unknown"]}
        backgroundSummary: {"$ref":"#/components/schemas/BackgroundSummary"}
        publishedSha: {"type":["string","null"]}
        publicationError: {"type":["string","null"]}
        gate: {"type":"string"}
      required: [commandId, revision, backgroundState, publishedSha, publicationError, gate]
      additionalProperties: false
    HookReceipt:
      type: object
      properties:
        accepted: {"type":"boolean"}
        reason: {"type":"string"}
        event: {"oneOf":[{"$ref":"#/components/schemas/TurnEvent"},{"type":"null"}]}
        completion: {"enum":["pending","finished"],"description":"Completion captured by the controller. Finished does not mean a paused run resumed or the task succeeded."}
      required: [accepted, reason, event]
      additionalProperties: false
    RelayRun:
